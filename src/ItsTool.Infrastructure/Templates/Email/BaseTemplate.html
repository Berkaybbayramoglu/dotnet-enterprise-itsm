<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ITSM Tool Notification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #334155; margin: 0; padding: 0; background-color: #f8fafc; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; margin-top: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .header { background-color: #3b82f6; color: #ffffff; padding: 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .content { padding: 32px 24px; }
        .event-name { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #0f172a; }
        .ticket-info { background: #f1f5f9; padding: 16px; border-radius: 6px; margin-bottom: 24px; border-left: 4px solid #3b82f6; }
        .ticket-number { font-weight: 600; color: #3b82f6; }
        .message { margin-bottom: 32px; font-size: 15px; }
        .btn { display: inline-block; background-color: #3b82f6; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500; text-align: center; }
        .btn:hover { background-color: #2563eb; }
        .footer { padding: 24px; text-align: center; font-size: 13px; color: #94a3b8; background-color: #f8fafc; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ITSM Tool</h1>
        </div>
        <div class="content">
            <div class="event-name">{{EventName}}</div>
            
            <div class="ticket-info">
                Ticket: <span class="ticket-number">{{TicketNumber}}</span><br>
                Title: {{Title}}
            </div>
            
            <div class="message">
                {{Context}}
            </div>
            
            <div style="text-align: center;">
                <a href="{{AppUrl}}" class="btn">View Ticket</a>
            </div>
        </div>
        <div class="footer">
            This is an automated notification from the ITSM Tool.<br>
            Please do not reply to this email.
        </div>
    </div>
</body>
</html>
