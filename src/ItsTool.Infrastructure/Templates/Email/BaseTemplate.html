<!DOCTYPE html>
<html lang="en" xml:lang="en">
<head>
    <meta charset="utf-8">
    <title>ITSM Tool Notification</title>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #1e293b; margin: 0; padding: 0; background-color: #f1f5f9; }
        .wrapper { padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .header { background: linear-gradient(135deg, #2563eb, #1e40af); color: #ffffff; padding: 32px 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .content { padding: 40px 32px; }
        .event-name { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
        .ticket-info { background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 28px; border: 1px solid #e2e8f0; border-left: 4px solid #3b82f6; }
        .ticket-label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; font-weight: 600; display: block; margin-bottom: 4px; }
        .ticket-number { font-weight: 700; color: #2563eb; font-size: 16px; margin-bottom: 8px; display: inline-block; }
        .ticket-title { font-size: 15px; color: #334155; font-weight: 500; }
        .message { margin-bottom: 36px; font-size: 16px; color: #334155; line-height: 1.7; padding: 16px; background-color: #fef2f2; border-radius: 8px; border-left: 4px solid #ef4444; }
        .message.normal-msg { background-color: #f0fdf4; border-left-color: #22c55e; }
        .btn-container { text-align: center; margin-top: 10px; }
        .btn { display: inline-block; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 15px; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); transition: all 0.2s ease; }
        .footer { padding: 32px 24px; text-align: center; font-size: 13px; color: #94a3b8; background-color: #f8fafc; border-top: 1px solid #e2e8f0; }
        .footer p { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <h1>ITSM Portal</h1>
            </div>
            <div class="content">
                <div class="event-name">{{EventName}}</div>
                
                <div class="ticket-info">
                    <span class="ticket-label">Ticket ID</span>
                    <span class="ticket-number">{{TicketNumber}}</span>
                    <br/>
                    <span class="ticket-label" style="margin-top: 12px;">Title</span>
                    <span class="ticket-title">{{Title}}</span>
                </div>
                
                <div class="message normal-msg">
                    {{Context}}
                </div>
                
                <div class="btn-container">
                    <a href="{{AppUrl}}" class="btn">View in ITSM Portal</a>
                </div>
            </div>
            <div class="footer">
                <p>This is an automated notification from your ITSM Portal.</p>
                <p>Please do not reply to this email.</p>
            </div>
        </div>
    </div>
</body>
</html>
