<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Dashboard</title>
    <link rel="stylesheet" href="css/design-system.css">
    <script src="js/lib/chart.js"></script>
</head>
<body>
    <div class="app-shell">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar">
                        <div class="sidebar-header">
                <svg viewBox="0 0 24 24" width="24" height="24" style="fill: var(--primary); margin-right: 8px;"><path d="M12 2L2 22h20L12 2zm0 3.83L18.17 19H5.83L12 5.83z"/></svg> ITSM Tool
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard
                </a>
                <a href="/tickets.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/></svg> Tickets
                </a>
                <a href="/kanban.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm6 14H5V5h4v12zm6 0h-4V5h4v12zm6 0h-4V5h4v12z"/></svg> Kanban
                </a>
                <a href="/kb.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Knowledge Base
                </a>
                
                <div class="sidebar-nav-title" style="padding: 16px 20px 8px; font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px;">Administration</div>
                <a href="/projects.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v2H8V8zm0 4h8v2H8v-2z"/></svg> Projects
                </a>
                <a href="/categories.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm15 0h-2v3h-3v2h3v3h2v-3h3v-2h-3v-3z"/></svg> Categories
                </a>
                <a href="/departments.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg> Departments
                </a>
                <a href="/groups.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg> Groups
                </a>
                <a href="/users.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Users
                </a>
                <a href="/roles.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg> Roles
                </a>
                <a href="/audit-log.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Audit Log
                </a>
                <a href="/webhooks.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3z"/></svg> Webhooks
                </a>
                <a href="/rules.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49-.12-.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg> Rules
                </a>
                <a href="/admin-fields.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg> Custom Fields
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>

                    <h2>Dashboard</h2>
                </div>
                <div class="topbar-right">
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn">Logout</button>
                </div>
            </header>
            
            <div class="content-area" style="max-width: 1440px; margin: 0 auto; padding: 20px;">
                <!-- KPI Row -->
                <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 16px;" id="overviewCards">
                    <!-- Populated by JS -->
                </div>

                <!-- Charts Row -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                    <div class="card" style="padding: 20px;">
                        <div style="font-weight: 600; margin-bottom: 16px;">Tickets by Status</div>
                        <div style="height: 260px; position: relative;" id="statusChartContainer">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                    <div class="card" style="padding: 20px;">
                        <div style="font-weight: 600; margin-bottom: 16px;">Tickets by Priority</div>
                        <div style="height: 260px; position: relative;" id="priorityChartContainer">
                            <canvas id="priorityChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- New Row: Team Workload & Recent Tickets -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="card" style="padding: 20px;">
                        <div style="font-weight: 600; margin-bottom: 16px;">Takım Yükü</div>
                        <div id="workloadList" style="display: flex; flex-direction: column; gap: 12px;">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                    <div class="card" style="padding: 20px;">
                        <div style="font-weight: 600; margin-bottom: 16px;">Son Talepler</div>
                        <div id="recentTicketsList" style="display: flex; flex-direction: column; gap: 8px;">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Drill-Down Modal -->
    <div id="drillDownModal" class="modal-overlay">
        <div class="modal" style="max-width: 800px; width: 90%;">
            <div class="modal-header">
                <h2 id="drillDownTitle">Details</h2>
                <button type="button" class="close-btn" onclick="closeModal('drillDownModal')" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="drillDownCount" style="margin-bottom: 12px; font-weight: 500; color: var(--text-muted);"></div>
                <div id="drillDownList" style="display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; padding-right: 8px;">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import './js/api.js';
        import { bindShellActions, showToast, openTicketPreview, openModal, closeModal } from './js/ui.js';
        
        window.openModal = openModal;
        window.closeModal = closeModal;

        window.openTicketPreviewWrapper = function(id) {
            let t = window.__recentTicketsCache?.find(x => x.id === id);
            if (!t && window.__drillDownCache) {
                t = window.__drillDownCache.find(x => x.id === id);
            }
            if (t) openTicketPreview(t, window.__lookupCache || {});
        };
        
        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        async function loadDashboard() {
            try {
                const overview = await window.api.getDashboardOverview();
                const dist = await window.api.getDashboardDistributions();
                
                let workload = [];
                try { workload = await window.api.request('/dashboard/agent-workload'); } catch(e) { console.warn("agent-workload error", e); }
                
                let recentTickets = [];
                try { 
                    const res = await window.api.searchTickets({ pageSize: 5 }); 
                    recentTickets = res.items || [];
                } catch(e) { console.warn("searchTickets error", e); }
                window.__recentTicketsCache = recentTickets;
                
                let lookup = {};
                try { lookup = await window.api.getLookup(); } catch(e) {}
                window.__lookupCache = lookup;

                const createKpiCard = (title, val, color, iconPath) => `
                    <div class="card" 
                         role="button" tabindex="0" 
                         style="display: flex; align-items: center; gap: 12px; height: 96px; padding: 16px; border-left: 4px solid var(--${color}); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;"
                         onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='var(--shadow-md)'"
                         onmouseout="this.style.transform='none'; this.style.boxShadow='var(--shadow-sm)'"
                         onclick="window.openDrillDown('${title}')"
                         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.openDrillDown('${title}');}">
                        <div style="width: 40px; height: 40px; border-radius: 8px; background: rgba(var(--${color}-rgb), 0.1); display: flex; align-items: center; justify-content: center; color: var(--${color});">
                            <svg viewBox="0 0 24 24" width="24" height="24" style="fill: currentColor;">${iconPath}</svg>
                        </div>
                        <div>
                            <div class="text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">${title}</div>
                            <div style="font-size: 28px; font-weight: 700; color: var(--${title === 'Avg CSAT' || title === 'Open Tickets' || title === 'Unassigned' ? 'text' : color}); line-height: 1.2;">${val}</div>
                        </div>
                    </div>
                `;

                document.getElementById('overviewCards').innerHTML = `
                    ${createKpiCard('Open Tickets', overview.openTickets ?? 0, 'info', '<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>')}
                    ${createKpiCard('Critical', overview.criticalTickets ?? 0, 'danger', '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>')}
                    ${createKpiCard('SLA Risk', overview.slaRiskTickets ?? 0, 'warning', '<path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>')}
                    ${createKpiCard('SLA Breached', overview.slaBreachedTickets ?? 0, 'danger', '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>')}
                    ${createKpiCard('Unassigned', overview.unassignedTickets ?? 0, 'default', '<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>')}
                    ${createKpiCard('Avg CSAT', overview.csatAverage ? overview.csatAverage.toFixed(1) : 0, 'success', '<path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/>')}
                `;

                // Workload List
                const workloadHtml = workload.length === 0 
                    ? '<div style="color:var(--text-muted); font-size: 14px; text-align: center; padding: 20px;">Henüz veri yok</div>'
                    : workload.map(w => `
                        <div style="display: flex; align-items: center; gap: 12px; font-size: 14px;">
                            <div class="avatar" style="width:32px; height:32px; font-size:14px;">${w.userName ? w.userName.charAt(0).toUpperCase() : 'U'}</div>
                            <div style="flex:1;">
                                <div style="font-weight: 500;">${w.userName || 'User ' + w.userId}</div>
                                <div style="width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden;">
                                    <div style="height: 100%; background: var(--primary); width: ${Math.min(w.openTicketCount * 10, 100)}%;"></div>
                                </div>
                            </div>
                            <div style="font-weight: 600;">${w.openTicketCount}</div>
                        </div>
                    `).join('');
                document.getElementById('workloadList').innerHTML = workloadHtml;

                // Recent Tickets List
                const getStatusName = (id) => lookup.statuses?.find(s => s.id === id)?.name || 'Unknown';
                const getStatusBadge = (status) => {
                    const map = { 'Open': 'info', 'In Progress': 'warning', 'Pending': 'warning', 'Resolved': 'success', 'Closed': 'default', 'Açık': 'info', 'Devam Ediyor': 'warning', 'Beklemede': 'warning', 'Çözüldü': 'success', 'Kapatıldı': 'default' };
                    return `<span class="badge badge-${map[status] || 'default'}" style="font-size: 11px;">${status}</span>`;
                };
                
                const recentHtml = recentTickets.length === 0
                    ? '<div style="color:var(--text-muted); font-size: 14px; text-align: center; padding: 20px;">Henüz veri yok</div>'
                    : recentTickets.map(t => `
                        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-hover); border-radius: 8px; cursor: pointer; transition: 0.2s;" onclick="window.openTicketPreviewWrapper(${t.id})" onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background='var(--bg-hover)'">
                            <div style="font-family: monospace; font-weight: 600; color: var(--primary);">${t.ticketNumber}</div>
                            <div style="flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${t.title}</div>
                            ${getStatusBadge(getStatusName(t.statusId))}
                        </div>
                    `).join('');
                document.getElementById('recentTicketsList').innerHTML = recentHtml;

                if (!dist.byStatus || dist.byStatus.length === 0) {
                    document.getElementById('statusChartContainer').innerHTML = '<div style="display:flex; height:100%; align-items:center; justify-content:center; color:var(--text-muted);">Henüz veri yok</div>';
                } else {
                    new Chart(document.getElementById('statusChart'), {
                        type: 'doughnut',
                        data: {
                            labels: dist.byStatus.map(d => d.key),
                            datasets: [{ data: dist.byStatus.map(d => d.count), backgroundColor: ['#0052CC','#00875A','#FF991F','#DE350B','#42526E'] }]
                        },
                        options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, cutout: '62%' }
                    });
                }

                if (!dist.byPriority || dist.byPriority.length === 0) {
                    document.getElementById('priorityChartContainer').innerHTML = '<div style="display:flex; height:100%; align-items:center; justify-content:center; color:var(--text-muted);">Henüz veri yok</div>';
                } else {
                    new Chart(document.getElementById('priorityChart'), {
                        type: 'bar',
                        data: {
                            labels: dist.byPriority.map(d => d.key),
                            datasets: [{ label: 'Count', data: dist.byPriority.map(d => d.count), backgroundColor: '#0052CC' }]
                        },
                        options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }

            } catch (err) {
                console.warn("Defensive rendering triggered due to error:", err);
                let errEl = document.querySelector('tbody') || document.querySelector('#overviewCards') || document.querySelector('#board') || document.querySelector('#articleList') || document.querySelector('.content-area');
                if (errEl) {
                    if (errEl.tagName === 'TBODY') {
                        errEl.innerHTML = '<tr><td colspan="100" style="text-align: center; padding: var(--spacing-xl); color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</td></tr>';
                    } else {
                        errEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</div>';
                    }
                }

                if(err.message === 'Unauthorized') return;
                showToast('Error loading dashboard', 'error');
            }
        }
        
        window.openDrillDown = async function(type) {
            document.getElementById('drillDownTitle').textContent = type + ' Details';
            document.getElementById('drillDownCount').textContent = 'Loading...';
            document.getElementById('drillDownList').innerHTML = '<div style="padding:20px;text-align:center;">Loading data...</div>';
            
            // Need ui.js openModal available in global
            if (window.openModal) window.openModal('drillDownModal');

            const getStatusName = (id) => window.__lookupCache?.statuses?.find(s => s.id === id)?.name || 'Unknown';
            const getPriorityName = (id) => window.__lookupCache?.priorities?.find(s => s.id === id)?.name || 'Normal';
            const getStatusBadge = (status) => {
                const map = { 'Open': 'info', 'In Progress': 'warning', 'Pending': 'warning', 'Resolved': 'success', 'Closed': 'default' };
                return `<span class="badge badge-${map[status] || 'default'}" style="font-size: 11px;">${status}</span>`;
            };
            
            const renderTickets = (items) => {
                window.__drillDownCache = items;
                document.getElementById('drillDownCount').textContent = `${items.length} records found`;
                if (items.length === 0) {
                    document.getElementById('drillDownList').innerHTML = '<div style="color:var(--text-muted); font-size: 14px; text-align: center; padding: 20px;">Bu kategoride talep yok</div>';
                    return;
                }
                
                document.getElementById('drillDownList').innerHTML = items.map(t => `
                    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: 0.2s;" onclick="window.openTicketPreviewWrapper(${t.id})" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='var(--bg-surface)'">
                        <div style="font-family: monospace; font-weight: 600; color: var(--primary);">${t.ticketNumber}</div>
                        <div style="flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${t.title}</div>
                        ${getStatusBadge(getStatusName(t.statusId))}
                        <span class="badge badge-default" style="font-size: 11px;">${getPriorityName(t.priorityId)}</span>
                    </div>
                `).join('');
            };

            try {
                if (type === 'Avg CSAT') {
                    const surveys = await window.api.getDashboardSurveys();
                    document.getElementById('drillDownCount').textContent = `${surveys.length} survey(s) found`;
                    if (surveys.length === 0) {
                        document.getElementById('drillDownList').innerHTML = '<div style="color:var(--text-muted); font-size: 14px; text-align: center; padding: 20px;">Bu kategoride talep yok</div>';
                    } else {
                        document.getElementById('drillDownList').innerHTML = surveys.map(s => `
                            <div style="padding: 12px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <strong style="color:var(--primary);">Rating: ${s.rating}/5</strong>
                                    <span style="font-size: 12px; color: var(--text-muted);">${new Date(s.createdAt).toLocaleString()}</span>
                                </div>
                                <div style="font-size: 14px; color: var(--text-main); font-style: italic;">"${s.comment || 'No comment'}"</div>
                            </div>
                        `).join('');
                    }
                    return;
                }
                
                let filter = { pageSize: 50 }; // Max 50 for drilldown
                if (type === 'Open Tickets') {
                    // Custom logic handled backend typically or we find open status ID
                    const closedStatus = window.__lookupCache?.statuses?.find(s => s.name === 'Closed');
                    if (closedStatus) filter.excludeStatusId = closedStatus.id; 
                } else if (type === 'Critical') {
                    const critPrio = window.__lookupCache?.priorities?.find(p => p.name === 'Critical');
                    if (critPrio) filter.priorityId = critPrio.id;
                    const closedStatus = window.__lookupCache?.statuses?.find(s => s.name === 'Closed');
                    if (closedStatus) filter.excludeStatusId = closedStatus.id;
                } else if (type === 'SLA Risk') {
                    filter.slaStatus = 'warning';
                } else if (type === 'SLA Breached') {
                    filter.slaStatus = 'breached';
                } else if (type === 'Unassigned') {
                    filter.unassigned = true;
                }
                
                // Note: We might need to adjust backend to support `excludeStatusId` or `unassigned`.
                // However, searchTickets in TicketService currently checks `filter.StatusId` and `filter.AssigneeUserId`.
                // For simplicity we will fetch tickets and filter them client-side if the backend doesn't support the exact filter natively.
                const res = await window.api.searchTickets({ pageSize: 100 });
                let items = res.items || [];
                
                // Client-side filtering as fallback if API doesn't support exact drill-down params
                if (type === 'Open Tickets') {
                    const closedId = window.__lookupCache?.statuses?.find(s => s.name === 'Closed' || s.name === 'Kapatıldı')?.id;
                    items = items.filter(t => t.statusId !== closedId);
                } else if (type === 'Critical') {
                    const critId = window.__lookupCache?.priorities?.find(p => p.name === 'Critical' || p.level === 1)?.id;
                    const closedId = window.__lookupCache?.statuses?.find(s => s.name === 'Closed' || s.name === 'Kapatıldı')?.id;
                    items = items.filter(t => t.priorityId === critId && t.statusId !== closedId);
                } else if (type === 'Unassigned') {
                    items = items.filter(t => !t.assignedUserId);
                }
                // SLA Risk/Breached logic relies on backend or ticketSla field (if populated in DTO).
                
                renderTickets(items);
            } catch (err) {
                console.error("Drill-down error", err);
                document.getElementById('drillDownList').innerHTML = '<div style="color:var(--danger); padding:20px; text-align:center;">Failed to load data.</div>';
            }
        };

        loadDashboard(); // removed await for resilience
    </script>
</body>
</html>
