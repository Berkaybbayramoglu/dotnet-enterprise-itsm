<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Dashboard</title>
    <link rel="stylesheet" href="css/design-system.css">
    <script src="js/lib/chart.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 24 24" width="24" height="24" style="fill: var(--primary); margin-right: 8px;"><path d="M12 2L2 22h20L12 2zm0 3.83L18.17 19H5.83L12 5.83z"/></svg> ITSM Tool
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard
                </a>
                <a href="/tickets.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/></svg> Tickets
                </a>
                <a href="/kanban.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm6 14H5V5h4v12zm6 0h-4V5h4v12zm6 0h-4V5h4v12z"/></svg> Kanban
                </a>
                <a href="/kb.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Knowledge Base
                </a>
                <a href="/audit-log.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Audit Log
                </a>
                <a href="/webhooks.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3z"/></svg> Webhooks
                </a>
                <a href="/rules.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg> Rules
                </a>
                <a href="/admin-fields.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg> Custom Fields
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <h2>Dashboard</h2>
                </div>
                <div class="topbar-right">
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn">Logout</button>
                </div>
            </header>
            
            <div class="content-area">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--spacing-md); margin-bottom: var(--spacing-lg);" id="overviewCards">
                    <!-- Populated by JS -->
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: var(--spacing-lg);">
                    <div class="card">
                        <canvas id="statusChart"></canvas>
                    </div>
                    <div class="card">
                        <canvas id="priorityChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import './js/api.js';
        import { bindShellActions, showToast } from './js/ui.js';
        
        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        async function loadDashboard() {
            try {
                const overview = await window.api.getDashboardOverview();
                const dist = await window.api.getDashboardDistributions();

                const cardsHtml = `
                    <div class="card" style="border-left: 4px solid var(--info);">
                        <div class="text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Open Tickets</div>
                        <div style="font-size: 32px; font-weight: 700; margin-top: var(--spacing-xs);">${overview.openTickets ?? 0}</div>
                    </div>
                    <div class="card" style="border-left: 4px solid var(--danger);">
                        <div class="text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Critical</div>
                        <div style="font-size: 32px; font-weight: 700; color: var(--danger); margin-top: var(--spacing-xs);">${overview.criticalTickets ?? 0}</div>
                    </div>
                    <div class="card" style="border-left: 4px solid var(--warning);">
                        <div class="text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">SLA Risk</div>
                        <div style="font-size: 32px; font-weight: 700; color: var(--warning); margin-top: var(--spacing-xs);">${overview.slaRiskTickets ?? 0}</div>
                    </div>
                    <div class="card" style="border-left: 4px solid var(--danger);">
                        <div class="text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">SLA Breached</div>
                        <div style="font-size: 32px; font-weight: 700; color: var(--danger); margin-top: var(--spacing-xs);">${overview.slaBreachedTickets ?? 0}</div>
                    </div>
                    <div class="card" style="border-left: 4px solid var(--text-muted);">
                        <div class="text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Unassigned</div>
                        <div style="font-size: 32px; font-weight: 700; margin-top: var(--spacing-xs);">${overview.unassignedTickets ?? 0}</div>
                    </div>
                    <div class="card" style="border-left: 4px solid var(--success);">
                        <div class="text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Avg CSAT</div>
                        <div style="font-size: 32px; font-weight: 700; color: var(--success); margin-top: var(--spacing-xs);">${overview.avgCsatScore ?? 0}</div>
                    </div>
                `;
                document.getElementById('overviewCards').innerHTML = cardsHtml;

                new Chart(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: dist.byStatus.map(d => d.key),
                        datasets: [{ data: dist.byStatus.map(d => d.count), backgroundColor: ['#0052CC','#00875A','#FF991F','#DE350B','#42526E'] }]
                    },
                    options: { plugins: { title: { display: true, text: 'Tickets by Status', font: { size: 16 } } }, cutout: '70%' }
                });

                new Chart(document.getElementById('priorityChart'), {
                    type: 'bar',
                    data: {
                        labels: dist.byPriority.map(d => d.key),
                        datasets: [{ label: 'Count', data: dist.byPriority.map(d => d.count), backgroundColor: '#0052CC' }]
                    },
                    options: { plugins: { title: { display: true, text: 'Tickets by Priority', font: { size: 16 } } } }
                });

            } catch (err) {
                let errEl = document.querySelector('tbody') || document.querySelector('#overviewCards') || document.querySelector('#board') || document.querySelector('#articleList') || document.querySelector('.content-area');
                if (errEl) {
                    if (errEl.tagName === 'TBODY') {
                        errEl.innerHTML = '<tr><td colspan="100" style="text-align: center; padding: var(--spacing-xl); color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</td></tr>';
                    } else {
                        errEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</div>';
                    }
                }

                console.error(err);
                if(err.message === 'Unauthorized') return;
                showToast('Error loading dashboard', 'error');
            }
        }
        loadDashboard(); // removed await for resilience
    </script>
</body>
</html>
