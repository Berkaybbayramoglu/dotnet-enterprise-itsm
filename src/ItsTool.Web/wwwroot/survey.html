<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - CSAT Survey</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; }
        .header { background: #333; color: white; padding: 1rem; text-align: center; }
        .container { padding: 2rem; max-width: 600px; margin: 2rem auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .rating { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-direction: row-reverse; }
        
        .rating input { display: none; }
        .rating label { font-size: 2rem; color: #4d4d4d; cursor: pointer; transition: color 0.2s; }
        .rating input:checked ~ label { color: #d39e00; }
        .rating label:hover, .rating label:hover ~ label { color: #d39e00; }

        textarea { width: 100%; height: 100px; margin-bottom: 1rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        .btn { background: #004085; color: white; padding: 0.75rem 1.5rem; border: none; cursor: pointer; border-radius: 4px; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Customer Satisfaction Survey</h2>
    </div>
    
    <div class="container">
        <h3>How would you rate the resolution of your ticket?</h3>
        <p id="ticketInfo"></p>

        <form id="surveyForm">
            <div class="rating">
                <input type="radio" id="star5" name="rating" value="5" required /><label for="star5" title="Excellent">★</label>
                <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="Good">★</label>
                <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="Average">★</label>
                <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="Poor">★</label>
                <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="Terrible">★</label>
            </div>
            
            <textarea id="comment" placeholder="Additional comments (optional)" aria-label="Additional comments"></textarea>
            
            <button type="submit" class="btn">Submit Feedback</button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script type="module">
        if (!window.api.token) window.location.href = '/login.html';

        const urlParams = new URLSearchParams(window.location.search);
        const ticketId = urlParams.get('id');

        if (!ticketId) {
            document.querySelector('.container').innerHTML = '<h3>Invalid Link</h3><p>No ticket ID provided.</p>';
        } else {
            document.getElementById('ticketIdDisplay').textContent = ticketId;
        }

        document.getElementById('surveyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ratingInput = document.querySelector('input[name="rating"]:checked');
            if (!ratingInput) {
                alert("Please select a rating.");
                return;
            }

            const rating = Number.parseInt(ratingInput.value);
            const comment = document.getElementById('comment').value;

            try {
                await window.api.request(`/Ticket/${ticketId}/survey`, {
                    method: 'POST',
                    body: JSON.stringify({ rating, comment })
                });
                document.querySelector('.container').innerHTML = '<h3>Thank you!</h3><p>Your feedback has been recorded.</p><a href="/tickets.html">Back to Tickets</a>';
            } catch (err) {
                console.error(err);
                alert('Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
