<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Webhooks</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg); }
        .table-container { background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; }
        

    </style>
</head>
<body>
    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>

                    <h2 data-i18n="webhooks_title">Webhooks</h2>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell-container dropdown" style="position:relative; margin-right: 16px;">
                        <button class="btn btn-ghost dropdown-toggle" type="button" id="bellDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="position:relative;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                            <span class="badge" id="notificationBadge" style="display:none; position:absolute; top:4px; right:4px; background:var(--danger); color:white; border-radius:50%; font-size:10px; padding:2px 4px;"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bellDropdown" id="notificationList" style="width: 320px; max-height: 400px; overflow-y:auto;">
                            <li><h6 class="dropdown-header" data-i18n="topbar_notifications">Notifications</h6></li>
                            <div id="notificationItems"></div>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-center text-muted" href="#" onclick="markAllAsRead(event)" data-i18n="topbar_mark_all_read">Mark all as read</a></li>
                        </ul>
                    </div>
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn" data-i18n="topbar_logout">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="admin-header">
                    <div>
                        <h3 style="margin:0; font-size: 18px;" data-i18n="webhooks_title">Webhook Subscriptions</h3>
                        <p class="text-muted" style="margin: 4px 0 0 0; font-size: 13px;" data-i18n="webhooks_desc">Manage external system integrations via webhooks.</p>
                    </div>
                    <button type="button" class="btn btn-primary" id="btnAddWebhookModal">
                        <svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor; margin-right: 4px; vertical-align: middle;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> <span data-i18n="webhooks_btn_new">Add Webhook</span>
                    </button>
                </div>

                <div class="table-container">
                    <table class="table" id="webhooksTable">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th data-i18n="webhooks_col_endpoint">URL</th>
                                <th data-i18n="webhooks_col_event">Events</th>
                                <th data-i18n="webhooks_col_status">Status</th>
                                <th style="width: 140px;" data-i18n="webhooks_col_actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="webhooksBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Webhook Modal -->
    <div id="webhookModal" class="modal-overlay">
        <div class="modal">
            <form id="webhookForm">
                <div class="modal-header">
                    <h2 id="webhookModalTitle" data-i18n="webhooks_modal_new">Webhook</h2>
                    <button type="button" class="close-btn" onclick="closeModal('webhookModal')" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="webhookId">
                    <div class="form-group">
                        <label class="form-label" for="url" data-i18n="webhooks_lbl_url">Endpoint URL *</label>
                        <input id="url" class="form-control" required placeholder="https://api.example.com/webhook">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="eventsCsv" data-i18n="webhooks_lbl_event">Events *</label>
                        <input id="eventsCsv" class="form-control" placeholder="ticket.created, sla.breach" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="secret" data-i18n="webhooks_lbl_secret">Secret Key *</label>
                        <input id="secret" class="form-control" required placeholder="Authentication secret">
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="isActive" checked>
                        <label for="isActive" style="font-weight: 500; font-size: 14px; cursor: pointer;" data-i18n="webhooks_lbl_active">Is Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('webhookModal')" data-i18n="users_btn_cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" data-i18n="users_btn_save">Save Webhook</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Confirm Delete</h2>
                <button type="button" class="close-btn" onclick="closeModal('confirmModal')" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this webhook?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal('confirmModal')">Cancel</button>
                <button type="button" class="btn btn-danger" id="btnConfirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { injectShell } from './js/layout.js?v=6';
        import './js/api.js';
        import { bindShellActions, showToast, openModal, closeModal } from './js/ui.js';
        import { t } from './js/i18n.js';
        injectShell();

        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        let webhookToDelete = null;

        window.openModal = openModal;
        window.closeModal = closeModal;

        document.getElementById('btnAddWebhookModal').addEventListener('click', () => {
            document.getElementById('webhookForm').reset();
            document.getElementById('webhookId').value = '';
            document.getElementById('webhookModalTitle').textContent = t('webhooks_modal_new');
            openModal('webhookModal');
        });

        async function loadWebhooks() {
            try {
                const subs = await window.api.request('/webhook');
                const tbody = document.getElementById('webhooksBody');
                tbody.innerHTML = '';
                
                if (subs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: var(--spacing-xl); color: var(--text-muted);">${t('webhooks_no_data')}</td></tr>`;
                    return;
                }

                subs.forEach(s => {
                    const tr = document.createElement('tr');
                    
                    const statusBadge = s.isActive 
                        ? `<span class="badge badge-success btn-toggle" style="cursor: pointer;" data-id="${s.id}" title="Click to disable">Active</span>`
                        : `<span class="badge badge-default btn-toggle" style="cursor: pointer;" data-id="${s.id}" title="Click to enable">Inactive</span>`;
                        
                    tr.innerHTML = `
                        <td style="font-family: monospace; color: var(--text-muted);">${s.id}</td>
                        <td style="font-weight: 500;">${escapeHtml(s.url)}</td>
                        <td style="font-size: 13px;">${escapeHtml(s.eventsCsv)}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <div style="display: flex; gap: 4px;">
                                <button type="button" class="btn btn-ghost btn-edit" style="padding: 4px 8px; color: var(--primary);" data-id="${s.id}" title="Edit">
                                    <svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                                </button>
                                <button type="button" class="btn btn-ghost btn-delete" style="padding: 4px 8px; color: var(--danger);" data-id="${s.id}" title="Delete">
                                    <svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                const urlParams = new URLSearchParams(window.location.search);
                const highlightId = urlParams.get('highlight');
                if (highlightId) {
                    setTimeout(() => {
                        const row = document.querySelector(`tr[data-id="${highlightId}"]`) || Array.from(document.querySelectorAll('tr')).find(r => r.innerHTML.includes(`data-id="${highlightId}"`));
                        if (row) {
                            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            row.classList.add('row-highlight');
                        }
                    }, 100);
                }
            } catch (e) { console.error(e); 
                let errEl = document.querySelector('tbody') || document.querySelector('#overviewCards') || document.querySelector('#board') || document.querySelector('#articleList') || document.querySelector('.content-area');
                if (errEl) {
                    if (errEl.tagName === 'TBODY') {
                        errEl.innerHTML = '<tr><td colspan="100" style="text-align: center; padding: var(--spacing-xl); color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</td></tr>';
                     } else {
                        errEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</div>';
                    }
                }

                console.error('Failed to load webhooks', e);
                showToast('Failed to load webhooks', 'error');
            }
        }

        document.getElementById('webhooksBody').addEventListener('click', async (e) => {
            const editBtn = e.target.closest('.btn-edit');
            const deleteBtn = e.target.closest('.btn-delete');
            const toggleBtn = e.target.closest('.btn-toggle');
            
            if (toggleBtn) {
                const id = Number.parseInt(toggleBtn.dataset.id);
                toggleBtn.style.opacity = '0.5';
                try {
                    await window.api.request(`/Webhook/${id}/toggle`, { method: 'PUT' });
                    showToast('Webhook status updated');
                    loadWebhooks();
                } catch (err) {
                    console.error(err);
                    showToast('Failed to toggle webhook', 'error');
                    toggleBtn.style.opacity = '1';
                }
            } else if (editBtn) {
                const id = Number.parseInt(editBtn.dataset.id);
                try {
                    const subs = await window.api.request('/webhook');
                    const sub = subs.find(s => s.id === id);
                    if (sub) {
                        document.getElementById('webhookId').value = sub.id;
                        document.getElementById('url').value = sub.url;
                        document.getElementById('eventsCsv').value = sub.eventsCsv;
                        document.getElementById('secret').value = sub.secret;
                        document.getElementById('isActive').checked = sub.isActive;
                        document.getElementById('webhookModalTitle').textContent = t('webhooks_modal_edit');
                        openModal('webhookModal');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('Failed to load webhook details', 'error');
                }
            } else if (deleteBtn) {
                const id = Number.parseInt(deleteBtn.dataset.id);
                webhookToDelete = id;
                openModal('confirmModal');
            }
        });

        document.getElementById('webhookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('webhookId').value;
            const payload = {
                url: document.getElementById('url').value,
                eventsCsv: document.getElementById('eventsCsv').value,
                secret: document.getElementById('secret').value,
                isActive: document.getElementById('isActive').checked
            };

            try {
                if (id) {
                    await window.api.request(`/webhook/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                    showToast('Webhook updated successfully');
                } else {
                    await window.api.request('/webhook', { method: 'POST', body: JSON.stringify(payload) });
                    showToast('Webhook created successfully');
                }
                closeModal('webhookModal');
        loadWebhooks(); // removed await for resilience
            } catch (e) {
                console.error(e);
                showToast('Failed to save webhook', 'error');
            }
        });


        document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
            if (!webhookToDelete) return;
            try {
                await window.api.request(`/webhook/${webhookToDelete}`, { method: 'DELETE' });
                closeModal('confirmModal');
                showToast('Webhook deleted successfully');
        loadWebhooks(); // removed await for resilience
            } catch (e) {
                console.error(e);
                showToast('Failed to delete webhook', 'error');
            } finally {
                webhookToDelete = null;
            }
        });

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replaceAll('&', "&amp;")
                .replaceAll('<', "&lt;")
                .replaceAll('>', "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = "none";
            }
        }

        document.addEventListener('DOMContentLoaded', loadWebhooks);
    </script>
</body>
</html>
