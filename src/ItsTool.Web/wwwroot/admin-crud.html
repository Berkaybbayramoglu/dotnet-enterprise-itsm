<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - ITSM Tool</title>
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>
                    <h2 id="topbarTitle" data-i18n="nav_admin_title">Administration</h2>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell-container dropdown" style="position:relative; margin-right: 16px;">
                        <button class="btn btn-ghost dropdown-toggle" type="button" id="bellDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="position:relative;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                            <span class="badge" id="notificationBadge" style="display:none; position:absolute; top:4px; right:4px; background:var(--danger); color:white; border-radius:50%; font-size:10px; padding:2px 4px;"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bellDropdown" id="notificationList" style="width: 320px; max-height: 400px; overflow-y:auto;">
                            <li><h6 class="dropdown-header" data-i18n="topbar_notifications">Notifications</h6></li>
                            <div id="notificationItems"></div>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-center text-muted" href="#" onclick="markAllAsRead(event)" data-i18n="topbar_mark_all_read">Mark all as read</a></li>
                        </ul>
                    </div>
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn" data-i18n="topbar_logout">Logout</button>
                </div>
            </header>
            <div class="content-area" style="padding: var(--spacing-xl);">
            <div id="crudRoot"></div>
            <div id="emptyState" style="display: none; text-align: center; padding: 40px; color: var(--text-muted);">
                <svg viewBox="0 0 24 24" width="48" height="48" style="fill: var(--text-muted); opacity: 0.5; margin-bottom: 16px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
                <h2>Unknown Administration Module</h2>
                <p>Please select a valid module from the sidebar.</p>
            </div>
            </div>
        </main>
    </div>

    <script type="module">
        import './js/api.js?v=4';
        import { bindShellActions } from './js/ui.js?v=7';
        import { injectShell } from './js/layout.js?v=10';
        import { initCrudPage } from './js/crud-page.js?v=7';
        import { adminConfigs } from './js/admin-configs.js?v=7';
        import { t } from './js/i18n.js';
        injectShell();

        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');

        const cfg = adminConfigs[type];
        if (cfg) {
            document.title = `${cfg.pageTitle} - ${t('nav_admin_title') || 'Yönetim'}`;
            cfg.rootId = 'crudRoot';
            initCrudPage(cfg);
            await window.loadData();
        } else {
            document.getElementById('crudRoot').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }
    </script>
</body>
</html>
