<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - ITSM Tool</title>
    <link rel="stylesheet" href="./css/index.css?v=2">
</head>
<body>
    <div class="app-layout" data-shell>
        <main class="main-content" style="padding: var(--spacing-xl);">
            <div id="crudRoot"></div>
            <div id="emptyState" style="display: none; text-align: center; padding: 40px; color: var(--text-muted);">
                <svg viewBox="0 0 24 24" width="48" height="48" style="fill: var(--text-muted); opacity: 0.5; margin-bottom: 16px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
                <h2>Unknown Administration Module</h2>
                <p>Please select a valid module from the sidebar.</p>
            </div>
        </main>
    </div>

    <script type="module">
        import './js/api.js?v=2';
        import { bindShellActions } from './js/ui.js?v=3';
        import { injectShell } from './js/layout.js';
        import { initCrudPage } from './js/crud-page.js';
        import { adminConfigs } from './js/admin-configs.js';

        if (!window.api.token) window.location.href = '/login.html';
        injectShell();
        bindShellActions();

        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');

        const cfg = adminConfigs[type];
        if (cfg) {
            document.title = `${cfg.pageTitle} - Administration`;
            cfg.rootId = 'crudRoot';
            initCrudPage(cfg);
            await window.loadData();
        } else {
            document.getElementById('crudRoot').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }
    </script>
</body>
</html>
