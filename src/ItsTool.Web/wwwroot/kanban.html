<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Kanban</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        .kanban-board { display: flex; gap: var(--spacing-lg); overflow-x: auto; height: calc(100vh - var(--topbar-height) - 40px); align-items: flex-start; padding-bottom: var(--spacing-md); }
        .column { background: rgba(9,30,66,0.04); border-radius: var(--radius-lg); min-width: 320px; max-width: 320px; display: flex; flex-direction: column; max-height: 100%; }
        .column-header { padding: var(--spacing-md); font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid transparent; }
        .column-body { padding: var(--spacing-sm); flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: var(--spacing-sm); min-height: 200px; }
        
        .card { background: var(--bg-surface); padding: var(--spacing-md); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); cursor: pointer; display: flex; flex-direction: column; gap: var(--spacing-sm); border-left: 3px solid transparent; transition: box-shadow 0.2s; }
        .card:hover { box-shadow: var(--shadow-md); }
        .card:active { cursor: grabbing; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-weight: 500; font-size: 14px; color: var(--text-main); }
        .card-number { font-size: 12px; color: var(--text-muted); font-weight: 600; text-decoration: none; }
        .card-number:hover { text-decoration: underline; color: var(--primary); }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: var(--spacing-xs); }
        
        /* Priorites mapping to border */
        .priority-Critical { border-left-color: var(--danger); }
        .priority-High { border-left-color: var(--warning); }
        .priority-Medium { border-left-color: var(--info); }
        .priority-Low { border-left-color: var(--success); }

        /* Column Status Header Strips */
        .col-1 .column-header { border-bottom-color: var(--info); }
        .col-2 .column-header { border-bottom-color: var(--warning); }
        .col-3 .column-header { border-bottom-color: var(--text-muted); }
        .col-4 .column-header { border-bottom-color: var(--success); }
        .col-5 .column-header { border-bottom-color: var(--danger); }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 24 24" width="24" height="24" style="fill: var(--primary); margin-right: 8px;"><path d="M12 2L2 22h20L12 2zm0 3.83L18.17 19H5.83L12 5.83z"/></svg> ITSM Tool
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard
                </a>
                <a href="/tickets.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm16 16H5V5h4v14zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/></svg> Tickets
                </a>
                <a href="/kanban.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm6 14H5V5h4v12zm6 0h-4V5h4v12zm6 0h-4V5h4v12z"/></svg> Kanban
                </a>
                <a href="/kb.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Knowledge Base
                </a>
                <a href="/audit-log.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Audit Log
                </a>
                <a href="/webhooks.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3z"/></svg> Webhooks
                </a>
                <a href="/rules.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg> Rules
                </a>
                <a href="/admin-fields.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg> Custom Fields
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <h2>Kanban Board</h2>
                </div>
                <div class="topbar-right">
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="kanban-board" id="board">
                    <!-- Columns will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal-overlay">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h2>Ticket Preview</h2>
                <button type="button" class="close-btn" onclick="closeModal('previewModal')" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body" id="previewContent">
                <!-- Preview details injected here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal('previewModal')">Close</button>
                <a href="#" id="previewDetailLink" class="btn btn-primary">Detaya Git</a>
            </div>
        </div>
    </div>

    <script type="module">
        import './js/api.js';
        import { bindShellActions, showToast } from './js/ui.js';
        
        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        let statuses = [];
        let tickets = [];

        const getAvatar = (id, fallback) => {
            if (!id || id === '-') return `<div class="avatar" style="background: var(--bg-hover); color: var(--text-muted); border: 1px dashed var(--border);">?</div>`;
            const initial = String(fallback || id).charAt(0).toUpperCase();
            return `<div class="avatar" title="${fallback}">${initial}</div>`;
        };

        const getPriorityIcon = (priority) => {
            const colors = { 'Critical': 'var(--danger)', 'High': 'var(--warning)', 'Medium': 'var(--info)', 'Low': 'var(--success)' };
            return `<svg viewBox="0 0 24 24" width="16" height="16" style="fill: ${colors[priority] || 'var(--text-muted)'}"><path d="M16 11V3H8v6H2v12h20V11h-6zM10 5h4v14h-4V5zM4 11h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg>`;
        };

        async function initKanban() {
            try {
                // Simplified status mock
                statuses = [
                    { id: 1, name: 'Open' },
                    { id: 2, name: 'In Progress' },
                    { id: 3, name: 'Pending' },
                    { id: 4, name: 'Resolved' },
                    { id: 5, name: 'Closed' }
                ];

                const board = document.getElementById('board');
                statuses.forEach(s => {
                    const col = document.createElement('div');
                    col.className = `column col-${s.id}`;
                    col.innerHTML = `
                        <div class="column-header">
                            <span style="text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px;">${s.name}</span>
                            <span class="badge badge-default" id="count-${s.id}">0</span>
                        </div>
                        <div class="column-body" data-status-id="${s.id}" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                    `;
                    board.appendChild(col);
                });

                const res = await window.api.searchTickets({ pageSize: 100 });
                tickets = res.items;

                renderTickets();
            } catch(e) { console.error(e); }
        }

        function renderTickets() {
            document.querySelectorAll('.column-body').forEach(c => c.innerHTML = '');
            const counts = {};

            tickets.forEach(t => {
                // Normalize statusId for mockup if needed, assume it matches 1-5 or use default
                let sId = t.statusId;
                if(typeof sId === 'string') {
                    // Try to map name to id for demo if it returns string
                    const found = statuses.find(x => x.name === sId);
                    if(found) sId = found.id; else sId = 1;
                }

                counts[sId] = (counts[sId] || 0) + 1;

                const colBody = document.querySelector(`.column-body[data-status-id="${sId}"]`);
                if (colBody) {
                    const card = document.createElement('div');
                    card.className = `card priority-${t.priorityId || 'Medium'}`;
                    card.draggable = true;
                    card.id = `ticket-${t.id}`;
                    let isDragging = false;
                    card.ondragstart = (ev) => { isDragging = true; window.drag(ev); };
                    card.ondragend = () => { setTimeout(() => isDragging = false, 150); };
                    card.onclick = (e) => {
                        if (e.target.closest('.card-number')) return;
                        if (!isDragging) showPreview(t);
                    };
                    card.tabIndex = 0;
                    card.onkeydown = (e) => {
                        if (e.key === 'Enter') showPreview(t);
                    };
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <a href="/ticket-detail.html?id=${t.id}" class="card-number" target="_blank">${escapeHtml(t.ticketNumber)}</a>
                            ${getPriorityIcon(t.priorityId)}
                        </div>
                        <div class="card-title">${escapeHtml(t.title)}</div>
                        <div class="card-footer">
                            ${getAvatar(t.assignedUserId, t.assignedUserId)}
                        </div>
                    `;
                    colBody.appendChild(card);
                }
            });

            // Update counts
            statuses.forEach(s => {
                const countBadge = document.getElementById(`count-${s.id}`);
                if(countBadge) countBadge.textContent = counts[s.id] || 0;
            });
        }

        window.allowDrop = function(ev) {
            ev.preventDefault();
        };

        window.drag = function(ev) {
            let el = ev.target;
            while(el && !el.classList.contains('card')) el = el.parentElement;
            if(el) ev.dataTransfer.setData("text", el.id);
        };

        window.drop = async function(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const card = document.getElementById(data);
            
            let target = ev.target;
            while(target && !target.classList.contains('column-body')) {
                target = target.parentElement;
            }

            if (target && card) {
                const newStatusId = Number.parseInt(target.dataset.statusId);
                const ticketId = Number.parseInt(card.id.replace('ticket-', ''));

                try {
                    // Actual API expects string status if we are mapping it, check mock API logic, normally ID
                    await window.api.request(`/Ticket/${ticketId}/status`, {
                        method: 'POST',
                        body: JSON.stringify(newStatusId)
                    });
                    
                    target.appendChild(card);
                    
                    // Re-calculate counts
                    document.querySelectorAll('.column-body').forEach(c => {
                        const sId = c.dataset.statusId;
                        const count = c.querySelectorAll('.card').length;
                        document.getElementById(`count-${sId}`).textContent = count;
                    });

                    if (newStatusId === 5) {
                        showToast("Ticket closed. Sending CSAT survey notification...");
                    } else {
                        showToast("Ticket moved successfully");
                    }
                } catch(e) {
                    console.error(e);
                    showToast('Geçersiz geçiş: Bu aşamaya geçilemez.', 'error');
                }
            }
        };

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replaceAll('&', "&amp;")
                .replaceAll('<', "&lt;")
                .replaceAll('>', "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        await initKanban();
        function showPreview(t) {
            const content = document.getElementById('previewContent');
            content.innerHTML = `
                <div style="margin-bottom: var(--spacing-sm);"><strong>Ticket:</strong> ${escapeHtml(t.ticketNumber)}</div>
                <div style="margin-bottom: var(--spacing-sm);"><strong>Title:</strong> ${escapeHtml(t.title)}</div>
                <div style="margin-bottom: var(--spacing-sm);"><strong>Description:</strong> ${escapeHtml(t.description || '').substring(0, 100)}${(t.description && t.description.length > 100) ? '...' : ''}</div>
                <div style="margin-bottom: var(--spacing-sm);"><strong>Priority:</strong> ${t.priorityId || 'Normal'}</div>
                <div style="margin-bottom: var(--spacing-sm);"><strong>Assignee:</strong> User ID ${t.assignedUserId || 'Unassigned'}</div>
                <div style="margin-bottom: var(--spacing-sm);"><strong>Requester:</strong> User ID ${t.requesterUserId || 'Unknown'}</div>
            `;
            document.getElementById('previewDetailLink').href = `/ticket-detail.html?id=${t.id}`;
            openModal('previewModal');
        }

        // Expose to window for inline onclicks in modals
        window.closeModal = closeModal;
    </script>
</body>
</html>
