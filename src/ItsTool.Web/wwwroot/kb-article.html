<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Knowledge Base Article</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        .kb-container { display: flex; flex-direction: column; gap: var(--spacing-lg); max-width: 800px; margin: 0 auto; padding: var(--spacing-xl) 0; }
        .article-meta { display: flex; gap: var(--spacing-md); color: var(--text-muted); font-size: 13px; margin-bottom: var(--spacing-lg); padding-bottom: var(--spacing-md); border-bottom: 1px solid var(--border); align-items: center; }
        .article-content { font-size: 16px; line-height: 1.6; color: var(--text-main); white-space: pre-wrap; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: var(--spacing-md); font-weight: 500; cursor: pointer; color: var(--primary); }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>

                    <h2>Knowledge Base Article</h2>
                </div>
                <div class="topbar-right">
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="kb-container">
                    <a href="/kb.html" class="back-link">
                        <svg viewBox="0 0 24 24" width="20" height="20" style="fill: currentColor;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> 
                        Back to Knowledge Base
                    </a>
                    
                    
                    <div id="adminActionBar" style="display: none; justify-content: flex-end; gap: 8px; margin-bottom: 16px;">
                        <button type="button" class="btn btn-ghost" id="btnTogglePublish"></button>
                        <button type="button" class="btn btn-secondary" id="btnEditArticle">Edit</button>
                        <button type="button" class="btn btn-danger" id="btnDeleteArticle">Delete</button>
                    </div>

                    <h1 id="articleTitle" style="font-size: 32px; margin-bottom: 8px;">Loading...</h1>
                    
                    <div class="article-meta">
                        <span id="articleDate"></span>
                        <span>•</span>
                        <span style="display:flex; align-items:center; gap: 4px;">
                            <svg viewBox="0 0 24 24" width="16" height="16" style="fill: currentColor;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                            <span id="articleViews">0</span> views
                        </span>
                        <span id="articleBadges" style="margin-left: auto;"></span>
                    </div>
                    
                    <div class="article-content" id="articleContent">
                        <p style="color: var(--text-muted);">Please wait while the article loads...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>


    <!-- Article Edit Modal -->
    <div id="articleModal" class="modal-overlay">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Edit Article</h2>
                <button type="button" class="close-btn" onclick="closeModal('articleModal')" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="articleForm">
                    <div class="form-group">
                        <label class="form-label" for="editArticleTitle">Title</label>
                        <input id="editArticleTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editArticleCategory">Category</label>
                        <select id="editArticleCategory" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editArticleVisibility">Visibility</label>
                        <select id="editArticleVisibility" class="form-control" required>
                            <option value="0">Public</option>
                            <option value="1">Internal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editArticleStatus">Status</label>
                        <select id="editArticleStatus" class="form-control" required>
                            <option value="0">Draft</option>
                            <option value="1">Published</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editArticleContent">Content</label>
                        <textarea id="editArticleContent" class="form-control" rows="8" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal('articleModal')">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSaveArticle">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import './js/api.js?v=2';
        import { injectShell } from './js/layout.js';
        import { bindShellActions, showToast, showUndoToast, openModal, closeModal } from './js/ui.js?v=2';
        injectShell();
        window.closeModal = closeModal;
        
        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replaceAll('&', "&amp;")
                .replaceAll('<', "&lt;")
                .replaceAll('>', "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function loadArticle() {
            if (!articleId) {
                showToast('Article ID missing', 'error');
                return;
            }
            try {
                const a = await window.api.request(`/kb/articles/${articleId}`);
                document.title = `${a.title} - ITSM Knowledge Base`;
                document.getElementById('articleTitle').textContent = a.title;
                document.getElementById('articleDate').textContent = new Date(a.createdAt).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('articleViews').textContent = a.viewCount;
                
                let badges = '';
                if (a.visibility === 1) badges += '<span class="badge badge-warning" style="margin-right: 8px;">Internal</span>';
                if (a.status === 0) badges += '<span class="badge badge-default">Draft</span>';
                document.getElementById('articleBadges').innerHTML = badges;
                
                document.getElementById('articleContent').innerHTML = escapeHtml(a.content);
                loadedArticle = a;
                if(isManager) {
                    const tBtn = document.getElementById('btnTogglePublish');
                    tBtn.textContent = a.status === 0 ? 'Publish' : 'Unpublish';
                }
            } catch (e) { console.error(e); 
                showToast('Failed to load article', 'error');
                document.getElementById('articleTitle').textContent = 'Article Not Found';
                document.getElementById('articleContent').innerHTML = '<p class="text-danger">The article you are looking for does not exist or you do not have permission to view it.</p>';
             }
        }
        
        
        let loadedArticle = null;
        let isManager = false;

        try {
            const payload = JSON.parse(atob(window.api.token.split('.')[1]));
            let perms = [];
            if (payload.Permissions) {
                perms = typeof payload.Permissions === 'string' ? [payload.Permissions] : payload.Permissions;
            }
            if (perms.includes('kb.manage')) {
                isManager = true;
                document.getElementById('adminActionBar').style.display = 'flex';
                
                // Load categories for edit modal
                try {
                    const cats = await window.api.request('/kb/categories');
                    const sel = document.getElementById('editArticleCategory');
                    cats.forEach(c => {
                        sel.innerHTML += `<option value="${c.id}">${escapeHtml(c.name)}</option>`;
                    });
                } catch (e) {
                    console.error(e);
                }
            }
        } catch (e) { console.error(e); }

        document.getElementById('btnEditArticle')?.addEventListener('click', () => {
            if(!loadedArticle) return;
            document.getElementById('editArticleTitle').value = loadedArticle.title;
            document.getElementById('editArticleCategory').value = loadedArticle.categoryId;
            document.getElementById('editArticleVisibility').value = loadedArticle.visibility;
            document.getElementById('editArticleStatus').value = loadedArticle.status;
            document.getElementById('editArticleContent').value = loadedArticle.content;
            openModal('articleModal');
        });

        document.getElementById('btnSaveArticle')?.addEventListener('click', async () => {
            const data = {
                title: document.getElementById('editArticleTitle').value,
                categoryId: Number.parseInt(document.getElementById('editArticleCategory').value),
                visibility: Number.parseInt(document.getElementById('editArticleVisibility').value),
                status: Number.parseInt(document.getElementById('editArticleStatus').value),
                content: document.getElementById('editArticleContent').value
            };
            try {
                await window.api.request(`/kb/articles/${articleId}`, { method: 'PUT', body: JSON.stringify(data) });
                closeModal('articleModal');
                showToast('Article updated successfully.');
                loadArticle();
            } catch (e) { console.error(e);  showToast('Update failed', 'error');  }
        });

        document.getElementById('btnTogglePublish')?.addEventListener('click', async () => {
            if(!loadedArticle) return;
            const newStatus = loadedArticle.status === 0 ? 1 : 0;
            const oldStatus = loadedArticle.status;
            
            try {
                loadedArticle.status = newStatus;
                await window.api.request(`/kb/articles/${articleId}`, { method: 'PUT', body: JSON.stringify(loadedArticle) });
                loadArticle(); // Refresh UI
                
                showUndoToast(newStatus === 1 ? 'Article published.' : 'Article unpublished.', async () => {
                    loadedArticle.status = oldStatus;
                    await window.api.request(`/kb/articles/${articleId}`, { method: 'PUT', body: JSON.stringify(loadedArticle) });
                    loadArticle();
                });
            } catch (e) { console.error(e); 
                loadedArticle.status = oldStatus;
                showToast('Failed to change publish status.', 'error');
             }
        });

        document.getElementById('btnDeleteArticle')?.addEventListener('click', () => {
            showUndoToast('Article will be deleted.', async () => {
                // Cancelled
                console.log('Delete cancelled by Undo.');
            }).then(async (proceed) => {
                if (proceed) {
                    try {
                        await window.api.request(`/kb/articles/${articleId}`, { method: 'DELETE' });
                        window.location.href = '/kb.html';
                    } catch (e) { console.error(e);  showToast('Delete failed.', 'error');  }
                }
            });
        });

        await loadArticle();
    </script>
</body>
</html>
