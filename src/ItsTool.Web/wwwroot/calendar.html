<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Calendar</title>
    <link rel="stylesheet" href="css/design-system.css?v=1008">
    <script src="js/fullcalendar.global.min.js"></script>
    <style>
        #calendar {
            background: var(--bg-surface);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            min-height: 600px;
        }
        .fc-event {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>
                    <h2 data-i18n="nav_calendar">Calendar</h2>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell-container dropdown" style="position:relative; margin-right: 16px;">
                        <button class="btn btn-ghost dropdown-toggle" type="button" id="bellDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="position:relative;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                            <span class="badge" id="notificationBadge" style="display:none; position:absolute; top:4px; right:4px; background:var(--danger); color:white; border-radius:50%; font-size:10px; padding:2px 4px;"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bellDropdown" id="notificationList" style="width: 320px; max-height: 400px; overflow-y:auto;">
                            <li><h6 class="dropdown-header" data-i18n="topbar_notifications">Notifications</h6></li>
                            <div id="notificationItems"></div>
                            <li><hr class="dropdown-divider"></li>
                            <li><button type="button" class="dropdown-item text-center text-muted" onclick="markAllAsRead(event)" data-i18n="topbar_mark_all_read" style="width: 100%; border: none; background: none;">Mark all as read</button></li>
                        </ul>
                    </div>
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn" data-i18n="topbar_logout">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 12px; align-items: center; gap: 12px;">
                    <label for="calendarMonthSelect" style="font-size: 13px; font-weight: 500; color: var(--text-muted);" data-i18n="calendar_jump_date">Tarihe Git:</label>
                    <div style="display: flex; gap: 4px; background: var(--bg-surface); padding: 4px; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">
                        <select id="calendarMonthSelect" aria-label="Ay Seçimi" style="border: none; background: transparent; padding: 4px 8px; outline: none; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-main);">
                            <option value="01">Ocak</option>
                            <option value="02">Şubat</option>
                            <option value="03">Mart</option>
                            <option value="04">Nisan</option>
                            <option value="05">Mayıs</option>
                            <option value="06">Haziran</option>
                            <option value="07">Temmuz</option>
                            <option value="08">Ağustos</option>
                            <option value="09">Eylül</option>
                            <option value="10">Ekim</option>
                            <option value="11">Kasım</option>
                            <option value="12">Aralık</option>
                        </select>
                        <div style="width: 1px; background: var(--border); margin: 4px 0;"></div>
                        <label for="calendarYearSelect" style="display:none;" data-i18n="calendar_jump_year">Yıl Seçimi</label>
                        <select id="calendarYearSelect" aria-label="Yıl Seçimi" style="border: none; background: transparent; padding: 4px 8px; outline: none; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-main);">
                        </select>
                    </div>
                </div>
                <div id='calendar'></div>
            </div>
        </main>
    </div>

    <!-- User Details Modal -->
    <div id="assigneeModal" class="modal-overlay">
        <div class="modal" style="width: min(400px, 90%);">
            <div class="modal-header">
                <h2 data-i18n="td_modal_user_details">User Details</h2>
                <button type="button" class="close-btn" onclick="window.ui.closeModal('assigneeModal')" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <div id="aModalAvatar" style="margin-bottom: 16px; display: flex; justify-content: center;"></div>
                <h3 id="aModalName" style="margin: 0 0 4px 0;" aria-label="Assignee Name">Assignee</h3>
                <p id="aModalUsername" class="text-muted" style="margin: 0 0 16px 0; font-size: 13px;"></p>
                <div style="text-align: left; background: var(--bg-surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border);">
                    <div style="margin-bottom: 8px;"><strong data-i18n="td_email">Email:</strong> <span id="aModalEmail"></span></div>
                    <div style="margin-bottom: 8px;"><strong data-i18n="td_dept">Department:</strong> <span id="aModalDept"></span></div>
                    <div><strong data-i18n="td_status">Status:</strong> <span id="aModalStatus"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import './js/api.js?v=1002';
        import { injectShell } from './js/layout.js?v=1002';
        import { bindShellActions, showToast } from './js/ui.js?v=1002';
        import { getCurrentLanguage, t } from './js/i18n.js?v=1002';
        
        injectShell();
        
        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();
        
        let globalLookupData = {};

        // 16 High-contrast, vibrant professional colors
        const TICKET_PALETTE = [
            '#2563eb', // Blue
            '#059669', // Emerald
            '#d97706', // Amber
            '#7c3aed', // Purple
            '#dc2626', // Red
            '#0891b2', // Cyan
            '#ea580c', // Orange
            '#db2777', // Pink
            '#4f46e5', // Indigo
            '#16a34a', // Green
            '#9333ea', // Violet
            '#0284c7', // Sky
            '#b45309', // Brown
            '#e11d48', // Rose
            '#0d9488', // Dark Teal
            '#475569'  // Slate
        ];

        function getTicketColor(t) {
            if (t.colorHex && t.colorHex.trim() !== '') {
                return t.colorHex;
            }
            const id = Number.parseInt(t.id, 10) || 1;
            // Prime step multiplier distributes consecutive IDs across high-contrast colors
            return TICKET_PALETTE[(id * 7) % TICKET_PALETTE.length];
        }

        window.openUserDetails = function(userId) { return window.ui.showUserDetails(userId); };

        async function initCalendar() {
            try {
                const lookup = await window.api.getLookup();
                globalLookupData = {
                    projects: lookup.projects || [],
                    categories: lookup.categories || [],
                    priorities: lookup.priorities || [],
                    statuses: lookup.statuses || []
                };
                const uRes = await window.api.getUsers();
                window.globalUsers = Array.isArray(uRes) ? uRes : (uRes.items || []);
            } catch(err) {
                console.warn('Lookup data failed', err);
            }

            const currentLang = getCurrentLanguage();
            const isTr = currentLang === 'tr';

            const trLocale = {
                code: 'tr',
                week: {
                    dow: 1, // Hafta Pazartesi başlar
                    doy: 7
                },
                buttonText: {
                    prev: 'Geri',
                    next: 'İleri',
                    today: 'Bugün',
                    month: 'Ay',
                    week: 'Hafta',
                    day: 'Gün',
                    list: 'Ajanda'
                },
                weekText: 'Hf',
                allDayText: 'Tüm gün',
                moreLinkText: function(n) {
                    return '+ daha fazla ' + n;
                },
                noEventsText: 'Gösterilecek etkinlik yok'
            };

            const mSelect = document.getElementById('calendarMonthSelect');
            const ySelect = document.getElementById('calendarYearSelect');

            if (mSelect) {
                const monthNamesTr = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
                const monthNamesEn = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                const monthNames = isTr ? monthNamesTr : monthNamesEn;
                mSelect.innerHTML = monthNames.map((name, idx) => {
                    const val = (idx + 1).toString().padStart(2, '0');
                    return `<option value="${val}">${name}</option>`;
                }).join('');
            }
            
            if (ySelect) {
                // Populate years dynamically (-5 to +5 years from now)
                const currentYear = new Date().getFullYear();
                ySelect.innerHTML = '';
                for (let y = currentYear - 5; y <= currentYear + 5; y++) {
                    let opt = document.createElement('option');
                    opt.value = y;
                    opt.text = y;
                    ySelect.appendChild(opt);
                }
            }

            var calendarEl = document.getElementById('calendar');
            if (!calendarEl) return;

            if (typeof FullCalendar === 'undefined') {
                console.error("FullCalendar is not defined");
                calendarEl.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">Takvim kütüphanesi yüklenemedi. Lütfen sayfayı yenileyin.</div>';
                return;
            }

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locales: [trLocale],
                locale: isTr ? 'tr' : 'en',
                firstDay: 1,
                buttonText: isTr ? {
                    today: 'Bugün',
                    month: 'Ay',
                    week: 'Hafta',
                    day: 'Gün',
                    list: 'Ajanda'
                } : {
                    today: 'Today',
                    month: 'Month',
                    week: 'Week',
                    day: 'Day',
                    list: 'List'
                },
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: async function(fetchInfo, successCallback, failureCallback) {
                    try {
                        const res = await window.api.searchTickets({ keyword: '', pageSize: 1000 });
                        
                        const events = (res.items || [])
                            .filter(t => t.estimatedStartDate || t.estimatedEndDate)
                            .map(t => {
                                const startStr = (t.estimatedStartDate || t.estimatedEndDate).split('T')[0];
                                const endStr = (t.estimatedEndDate || t.estimatedStartDate).split('T')[0];
                                const endDate = new Date(endStr);
                                // FullCalendar exclusive end date logic: add 1 day if it's all-day
                                endDate.setDate(endDate.getDate() + 1);
                                
                                const ticketColor = getTicketColor(t);
                                let titleStr = `#${t.id} - ${t.title}`;
                                return {
                                    id: t.id,
                                    title: titleStr,
                                    start: startStr,
                                    end: endDate.toISOString().split('T')[0],
                                    backgroundColor: ticketColor,
                                    borderColor: ticketColor,
                                    textColor: '#ffffff',
                                    allDay: true,
                                    extendedProps: {
                                        ticketData: t,
                                        activeAssignees: (t.assignments || []).filter(a => a.isActive && a.userId)
                                    }
                                };
                            });
                        
                        successCallback(events);
                    } catch (e) {
                        console.error('Failed to load tickets for calendar', e);
                        failureCallback(e);
                        showToast('Takvim verileri yüklenemedi', 'error');
                    }
                },
                eventContent: function(arg) {
                    let container = document.createElement('div');
                    container.style.display = 'flex';
                    container.style.justifyContent = 'space-between';
                    container.style.alignItems = 'center';
                    container.style.width = '100%';
                    container.style.padding = '2px 4px';
                    container.style.overflow = 'hidden';
                    
                    let titleWrapper = document.createElement('div');
                    titleWrapper.style.whiteSpace = 'nowrap';
                    titleWrapper.style.overflow = 'hidden';
                    titleWrapper.style.textOverflow = 'ellipsis';
                    titleWrapper.style.color = '#ffffff';
                    titleWrapper.style.fontWeight = '600';
                    titleWrapper.innerText = arg.event.title;
                    
                    let assigneesDiv = document.createElement('div');
                    assigneesDiv.style.display = 'flex';
                    assigneesDiv.style.alignItems = 'center';
                    assigneesDiv.style.gap = '4px';
                    assigneesDiv.style.flexShrink = '0';
                    assigneesDiv.style.marginLeft = '4px';
                    
                    const assignees = arg.event.extendedProps.activeAssignees;
                    if (arg.isEnd && assignees && assignees.length > 0) {
                        // Limit to 3 avatars for visual cleaness
                        const displayAssignees = assignees.slice(0, 3);
                        displayAssignees.forEach(a => {
                            let avatarHtml = window.ui.getAvatar(a.userId, a.assigneeName);
                            // Convert HTML string to DOM node
                            let wrapper = document.createElement('div');
                            wrapper.innerHTML = avatarHtml;
                            let avatarEl = wrapper.firstElementChild;
                            avatarEl.style.width = '18px';
                            avatarEl.style.height = '18px';
                            avatarEl.style.fontSize = '10px';
                            avatarEl.style.cursor = 'pointer';
                            avatarEl.style.background = '#ffffff';
                            avatarEl.style.color = 'var(--primary)';
                            avatarEl.style.border = '1px solid rgba(0,0,0,0.1)';
                            avatarEl.title = a.assigneeName;
                            
                            avatarEl.addEventListener('click', function(e) {
                                e.stopPropagation();
                                e.preventDefault();
                                window.openUserDetails(a.userId);
                            });
                            
                            assigneesDiv.appendChild(avatarEl);
                        });
                        
                        if (assignees.length > 3) {
                            let moreEl = document.createElement('div');
                            moreEl.className = 'avatar';
                            moreEl.style.width = '18px';
                            moreEl.style.height = '18px';
                            moreEl.style.fontSize = '10px';
                            moreEl.style.background = 'rgba(255,255,255,0.2)';
                            moreEl.innerText = '+' + (assignees.length - 3);
                            assigneesDiv.appendChild(moreEl);
                        }
                    }
                    
                    container.appendChild(titleWrapper);
                    container.appendChild(assigneesDiv);
                    
                    return { domNodes: [container] };
                },
                eventDidMount: function(info) {
                    const c = info.event.backgroundColor;
                    if (c) {
                        info.el.style.setProperty('background-color', c, 'important');
                        info.el.style.setProperty('border-color', c, 'important');
                        info.el.style.setProperty('color', '#ffffff', 'important');
                    }
                },
                eventClick: function(info) {
                    info.jsEvent.preventDefault();
                    if (window.openTicketPreview && info.event.extendedProps.ticketData) {
                        window.openTicketPreview(info.event.extendedProps.ticketData, globalLookupData);
                    } else {
                        window.location.href = `/ticket-detail.html?id=${info.event.id}`;
                    }
                },
                datesSet: function(info) {
                    var current = info.view ? info.view.currentStart : new Date();
                    var cm = (current.getMonth() + 1).toString().padStart(2, '0');
                    if (mSelect) mSelect.value = cm;
                    if (ySelect) ySelect.value = current.getFullYear();
                }
            });

            window.addEventListener('ticketColorChanged', function() {
                if (calendar) {
                    calendar.refetchEvents();
                }
            });

            calendar.render();

            if (mSelect && ySelect) {
                const jumpToDate = () => {
                    const y = ySelect.value;
                    const m = mSelect.value;
                    if (y && m && calendar) {
                        calendar.gotoDate(`${y}-${m}-01`);
                    }
                };

                mSelect.addEventListener('change', jumpToDate);
                ySelect.addEventListener('change', jumpToDate);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCalendar);
        } else {
            initCalendar();
        }
    </script>
</body>
</html>
