<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Audit Log</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--spacing-lg); flex-wrap: wrap; gap: var(--spacing-md); }
        .page-title h3 { margin: 0; font-size: 20px; color: var(--text-main); }
        .page-title p { margin: 4px 0 0 0; font-size: 13px; color: var(--text-muted); }
        
        .filter-panel { background: var(--bg-surface); padding: var(--spacing-lg); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: var(--spacing-lg); display: flex; flex-wrap: wrap; gap: var(--spacing-md); align-items: flex-end; }
        .filter-group { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        .filter-group input { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; }
        .filter-group input:focus { border-color: var(--primary); outline: none; }
        
        .table-container { background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow-x: auto; }
        
        .empty-state { text-align: center; padding: var(--spacing-xxl) var(--spacing-lg); color: var(--text-muted); }
        
        /* Value formatting */
        .value-cell { font-family: monospace; font-size: 12px; background: var(--bg-body); padding: 2px 6px; border-radius: 3px; display: inline-block; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 24 24" width="24" height="24" style="fill: var(--primary); margin-right: 8px;"><path d="M12 2L2 22h20L12 2zm0 3.83L18.17 19H5.83L12 5.83z"/></svg> ITSM Tool
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard
                </a>
                <a href="/tickets.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm16 16H5V5h4v14zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/></svg> Tickets
                </a>
                <a href="/kanban.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm6 14H5V5h4v12zm6 0h-4V5h4v12zm6 0h-4V5h4v12z"/></svg> Kanban
                </a>
                <a href="/kb.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Knowledge Base
                </a>
                <a href="/audit-log.html" class="sidebar-nav-item active">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Audit Log
                </a>
                <a href="/webhooks.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3z"/></svg> Webhooks
                </a>
                <a href="/rules.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49-.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg> Rules
                </a>
                <a href="/admin-fields.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg> Custom Fields
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <h2>System Audit Log</h2>
                </div>
                <div class="topbar-right">
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="page-title">
                        <h3>Event Log</h3>
                        <p>Track all system and user activities across the platform.</p>
                    </div>
                </div>

                <div class="filter-panel">
                    <div class="filter-group">
                        <label for="filterTicket">Ticket ID</label>
                        <input type="text" id="filterTicket" placeholder="e.g. ITS-1">
                    </div>
                    <div class="filter-group">
                        <label for="filterUserId">User ID</label>
                        <input type="number" id="filterUserId" placeholder="e.g. 5">
                    </div>
                    <div class="filter-group">
                        <label for="filterAction">Action Type</label>
                        <input type="text" id="filterAction" placeholder="e.g. Created, Updated">
                    </div>
                    <div class="filter-group">
                        <label for="filterFrom">From Date</label>
                        <input type="date" id="filterFrom">
                    </div>
                    <div class="filter-group">
                        <label for="filterTo">To Date</label>
                        <input type="date" id="filterTo">
                    </div>
                    <button type="button" class="btn btn-primary" id="btnSearchAudit" style="height: 38px; padding: 0 16px;">
                        <svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor; margin-right: 4px; vertical-align: middle;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> Filter
                    </button>
                </div>
                
                <div class="table-container">
                    <table class="table" style="min-width: 800px;">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Ticket</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Field Modified</th>
                                <th>Old Value</th>
                                <th>New Value</th>
                            </tr>
                        </thead>
                        <tbody id="auditList">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import './js/api.js';
        import { bindShellActions, showToast } from './js/ui.js';

        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        async function loadAuditLogs() {
            const ticket = document.getElementById('filterTicket').value;
            const userId = document.getElementById('filterUserId').value;
            const action = document.getElementById('filterAction').value;
            const fromDate = document.getElementById('filterFrom').value;
            const toDate = document.getElementById('filterTo').value;

            try {
                let lookup = {};
                let users = [];
                try {
                    lookup = await window.api.getLookup();
                    users = await window.api.getUsers();
                } catch(e) { console.warn('Lookup failed in audit', e); }

                const res = await window.api.getAuditLogs({
                    ticket, userId, action, fromDate, toDate, page: 1, pageSize: 100
                });
                
                const tbody = document.getElementById('auditList');
                tbody.innerHTML = '';
                
                if (res.items.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">No audit logs match the selected criteria.</div></td></tr>`;
                    return;
                }

                res.items.forEach(a => {
                    const tr = document.createElement('tr');
                    
                    let mappedOld = a.oldValue;
                    let mappedNew = a.newValue;
                    
                    if (a.fieldName === 'StatusId') {
                        mappedOld = lookup.statuses?.find(s => String(s.id) === a.oldValue)?.name || a.oldValue;
                        mappedNew = lookup.statuses?.find(s => String(s.id) === a.newValue)?.name || a.newValue;
                    } else if (a.fieldName === 'PriorityId') {
                        mappedOld = lookup.priorities?.find(s => String(s.id) === a.oldValue)?.name || a.oldValue;
                        mappedNew = lookup.priorities?.find(s => String(s.id) === a.newValue)?.name || a.newValue;
                    }
                    
                    const oldVal = mappedOld ? `<span class="value-cell" title="${escapeHtml(mappedOld)}">${escapeHtml(mappedOld)}</span>` : '<span class="text-muted">-</span>';
                    const newVal = mappedNew ? `<span class="value-cell" title="${escapeHtml(mappedNew)}">${escapeHtml(mappedNew)}</span>` : '<span class="text-muted">-</span>';
                    
                    const ticketLink = a.ticketId ? `<a href="/ticket-detail.html?id=${a.ticketId}">ITS-${a.ticketId}</a>` : '<span class="badge badge-default">CONFIG</span>';
                    
                    // a.createdBy is usually a string (e.g., UserId or System), try parsing to map username
                    const creatorUser = users.find(u => String(u.id) === a.createdBy);
                    const creatorName = creatorUser ? `@${creatorUser.username}` : (a.createdBy || '-');

                    tr.innerHTML = `
                        <td style="font-size: 13px; color: var(--text-muted);">${new Date(a.createdAt).toLocaleString()}</td>
                        <td style="font-weight: 500;">${ticketLink}</td>
                        <td style="font-family: monospace;">${escapeHtml(creatorName)}</td>
                        <td><span class="badge badge-default">${escapeHtml(a.action)}</span></td>
                        <td style="font-size: 13px;">${escapeHtml(a.fieldName) || '-'}</td>
                        <td>${oldVal}</td>
                        <td>${newVal}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                let errEl = document.querySelector('tbody') || document.querySelector('#overviewCards') || document.querySelector('#board') || document.querySelector('#articleList') || document.querySelector('.content-area');
                if (errEl) {
                    if (errEl.tagName === 'TBODY') {
                        errEl.innerHTML = '<tr><td colspan="100" style="text-align: center; padding: var(--spacing-xl); color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</td></tr>';
                    } else {
                        errEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</div>';
                    }
                }
 
                console.error(e);
                showToast('Failed to load audit logs. You might not have the required permissions.', 'error');
            }
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replaceAll('&', "&amp;")
                .replaceAll('<', "&lt;")
                .replaceAll('>', "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        document.getElementById('btnSearchAudit').addEventListener('click', async () => {
            const btn = document.getElementById('btnSearchAudit');
            btn.style.opacity = '0.7';
            btn.innerHTML = 'Loading...';
        loadAuditLogs(); // removed await for resilience
            btn.style.opacity = '1';
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor; margin-right: 4px; vertical-align: middle;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> Filter`;
        });

        // Add enter key support for inputs
        document.querySelectorAll('.filter-group input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('btnSearchAudit').click();
            });
        });
        loadAuditLogs(); // removed await for resilience
    </script>
</body>
</html>
