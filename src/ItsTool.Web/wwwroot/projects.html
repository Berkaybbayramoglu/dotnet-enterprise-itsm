                    </button>

                    <h2>Projects Management</h2>
                </div>
                <div class="topbar-right">
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="admin-header">
                    <div>
                        <h3 style="margin:0; font-size: 18px;">Projects</h3>
                        <p class="text-muted" style="margin: 4px 0 0 0; font-size: 13px;">Manage ITSM projects and their basic details.</p>
                    </div>
                    <button type="button" class="btn btn-primary" data-action="openProjectModal">
                        <svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor; margin-right: 4px; vertical-align: middle;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> New Project
                    </button>
                </div>

                <div class="table-container">
                    <table class="table" id="dataTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Key</th>
                                <th>Project Name</th>
                                <th>Status</th>
                                <th style="width: 100px;">Actions</th>
                            </tr>
                        </thead>

                            <!-- Populated by JS -->
                        </tbody>
                    </table>

    <!-- Create/Edit Modal -->
    <div id="projectModal" class="modal-overlay">
        <div class="modal">
            <form id="projectForm">
                <input type="hidden" id="pId">
                <div class="modal-header">
                    <h2 id="modalTitle">Project</h2>
                    <button type="button" class="close-btn" data-action="closeModal" data-target="projectModal" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label" for="pName" for="pName">Name *</label>
                        <input id="pName" class="form-control" required placeholder="e.g. IT Helpdesk">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="pKey" for="pKey">Project Key *</label>
                        <input id="pKey" class="form-control" required placeholder="e.g. ITS" maxlength="10">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="pStatus" for="pStatus">Status</label>
                        <select id="pStatus" class="form-control">
                            <option value="Active" style="color: var(--success); background-color: var(--success-light); font-weight: 600;">Active</option>
                            <option value="Inactive" style="color: var(--text-muted); background-color: var(--bg-hover); font-weight: 600;">Inactive</option>
                            <option value="Postponed" style="color: #B36200; background-color: var(--warning-light); font-weight: 600;">Postponed</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-action="closeModal" data-target="projectModal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    

    <script type="module">
        import './js/api.js?v=2';
        import { bindShellActions, showToast, escapeHtml, showUndoToast, openModal, closeModal } from './js/ui.js?v=3';

        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.getAttribute('data-action');
            const target = btn.getAttribute('data-target');
            const idAttr = btn.getAttribute('data-id');
            const flagAttr = btn.getAttribute('data-flag');
            const id = idAttr && idAttr !== 'undefined' ? Number.parseInt(idAttr) : undefined;
            const flag = flagAttr ? (flagAttr === 'true') : undefined;
            
            if (action === 'closeModal' && target) {
                if (typeof closeModal === 'function') closeModal(target); else if (typeof window.closeModal === 'function') window.closeModal(target);
            } else if (typeof window[action] === 'function') {
                if (flag !== undefined) window[action](id, flag);
                else window[action](id);
            }
        });


        let currentData = [];
        let itemToDelete = null;

        window.loadData = async function() {
            try {
                currentData = await window.api.getProjects();
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = '';
                
                if (currentData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: var(--spacing-xl); color: var(--text-muted);">No projects found.</td></tr>`;
                    return;
                }

                currentData.forEach(item => {
                    const tr = document.createElement('tr');
                    const statusStr = item.status || 'Active';
                    let statusColor = statusStr === 'Active' ? 'success' : (statusStr === 'Inactive' ? 'default' : 'warning');
                    
                    const badge = `
                        <select class="badge badge-${statusColor}" style="cursor:pointer; border: none; outline: none; appearance: none; padding: 4px 8px; font-weight: 600;" onchange="updateProjectStatus(${item.id}, this)">
                            <option value="Active" style="color: var(--success); background-color: var(--success-light); font-weight: 600;" ${statusStr === 'Active' ? 'selected' : ''}>Active</option>
                            <option value="Inactive" style="color: var(--text-muted); background-color: var(--bg-hover); font-weight: 600;" ${statusStr === 'Inactive' ? 'selected' : ''}>Inactive</option>
                            <option value="Postponed" style="color: #B36200; background-color: var(--warning-light); font-weight: 600;" ${statusStr === 'Postponed' ? 'selected' : ''}>Postponed</option>
                        </select>
                    `;
                    tr.innerHTML = `
                        <td class="text-muted">#${item.id}</td>
                        <td style="font-weight: 500;">${escapeHtml(item.projectKey)}</td>
                        <td>${escapeHtml(item.name)}</td>
                        <td>${badge}</td>
                        <td>
                            <button type="button" class="btn btn-ghost" style="padding: 4px 8px;" data-action="openProjectModal" data-id="${item.id}">Edit</button>
                            <button type="button" class="btn btn-ghost" style="color: var(--danger); padding: 4px 8px;" data-action="promptDelete" data-id="${item.id}">Del</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                let errEl = document.querySelector('tbody') || document.querySelector('#overviewCards') || document.querySelector('#board') || document.querySelector('#articleList') || document.querySelector('.content-area');
                if (errEl) {
                    if (errEl.tagName === 'TBODY') {
                        errEl.innerHTML = '<tr><td colspan="100" style="text-align: center; padding: var(--spacing-xl); color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</td></tr>';
                    } else {
                        errEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</div>';
                    }
                }

                console.error(err);
                showToast('Error loading projects', 'error');
            }
        };

        window.updateProjectStatus = async function(id, selectElement) {
            const newStatus = selectElement.value;
            const newColor = newStatus === 'Active' ? 'success' : (newStatus === 'Inactive' ? 'default' : 'warning');
            selectElement.className = `badge badge-${newColor}`;
            
            const item = currentData.find(x => x.id === id);
            if (!item) return;
            try {
                await window.api.updateProject(id, {
                    name: item.name,
                    description: item.description,
                    projectKey: item.projectKey,
                    status: newStatus
                });
                showToast('Project status updated');
                // No need to reload all data if we just updated the select locally
            } catch(e) { 
                showToast('Failed to update status', 'error');
                // Revert color on failure
                const oldStatusStr = item.status || 'Active';
                selectElement.value = oldStatusStr;
                const oldColor = oldStatusStr === 'Active' ? 'success' : (oldStatusStr === 'Inactive' ? 'default' : 'warning');
                selectElement.className = `badge badge-${oldColor}`;
            }
        };

        window.openProjectModal = function(id = null) {
            const form = document.getElementById('projectForm');
            form.reset();
            document.getElementById('pId').value = id || '';
            document.getElementById('modalTitle').textContent = id ? 'Edit Project' : 'New Project';
            
            if (id) {
                const item = currentData.find(x => x.id === id);
                if (item) {
                    document.getElementById('pName').value = item.name;
                    document.getElementById('pKey').value = item.projectKey;
                    document.getElementById('pStatus').value = item.status || 'Active';
                }
            }
            openModal('projectModal');
        };

        window.promptDelete = async function(id) {
            const proceed = await showUndoToast('Öğe silinecek. Geri almak için tıklayın.', null, 4000);
            if (proceed) {
                try {
                    await window.api.deleteProject(id);
                    showToast('Silme işlemi tamamlandı');
                    loadData();
                } catch (e) {
                    showToast('Silme işlemi başarısız', 'error');
                }
            }
        };

        

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('pId').value;
            const data = {
                name: document.getElementById('pName').value.trim(),
                projectKey: document.getElementById('pKey').value.trim(),
                status: document.getElementById('pStatus').value
            };
            
            try {
                if (id) await window.api.updateProject(id, data);
                else await window.api.createProject(data);
                
                closeModal('projectModal');
                showToast('Project saved');
        loadData(); // removed await for resilience
            } catch (err) {
                showToast('Failed to save project', 'error');
            }
        });

        loadData();
    </script>
</body>
