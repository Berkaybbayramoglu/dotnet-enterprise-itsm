<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - ITSM Tool</title>
    <link rel="stylesheet" href="./css/index.css?v=2">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ITSM Tool</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="nav-item">Dashboard</a>
                <a href="/tickets.html" class="nav-item">Tickets</a>
                <a href="/kb.html" class="nav-item">Knowledge Base</a>
                <div class="nav-group">
                    <div class="nav-group-title">ADMIN</div>
                    <a href="/users.html" class="nav-item">Users</a>
                    <a href="/departments.html" class="nav-item">Departments</a>
                    <a href="/groups.html" class="nav-item">Groups</a>
                    <a href="/roles.html" class="nav-item">Roles</a>
                    <a href="/projects.html" class="nav-item">Projects</a>
                    <a href="/categories.html" class="nav-item">Categories</a>
                    <a href="/webhooks.html" class="nav-item">Webhooks</a>
                </div>
            </nav>
        </aside>

        <!-- Topbar -->
        <header class="topbar">
            <div class="search-bar">
                <!-- Search input can go here -->
            </div>
            <div class="user-menu">
                <span id="currentUser" style="margin-right: 12px;"></span>
                <button class="btn btn-ghost" data-action="logout">Logout</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content" style="padding: var(--spacing-xl);">
            <div id="crudRoot"></div>
        </main>
    </div>

    <script type="module">
        import './js/api.js?v=2';
        import { bindShellActions } from './js/ui.js?v=3';
        import { initCrudPage } from './js/crud-page.js';

        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        initCrudPage({
            endpoint: '/Projects', pageTitle: 'Projects', rootId: 'crudRoot',
            modalId: 'projectModal', createTitle: 'New Project', auditSafeDelete: true,
            formFields: { id: 'pId', map: { 'name': 'pName', 'projectKey': 'pKey', 'status': 'pStatus' } },
            columns: [
                { key: 'id', label: 'ID', render: (item) => `<span class="text-muted">#${item.id}</span>` },
                { key: 'projectKey', label: 'Key', render: (item) => `<span style="font-weight: 500;">${window.ui?.escapeHtml(item.projectKey || '')}</span>` },
                { key: 'name', label: 'Name' },
                { key: 'status', label: 'Status', render: (item) => {
                    const statusStr = item.status || 'Active';
                    let color = 'default';
                    if (statusStr === 'Active') color = 'success';
                    if (statusStr === 'Warning') color = 'warning';
                    return `<span class="badge badge-${color}">${statusStr}</span>`;
                }}
            ],
            formHtml: `
                <div class="form-group">
                    <label class="form-label" for="pName">Name *</label>
                    <input id="pName" class="form-control" required placeholder="e.g. Customer Portal">
                </div>
                <div class="form-group">
                    <label class="form-label" for="pKey">Project Key *</label>
                    <input id="pKey" class="form-control" required placeholder="e.g. CP" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label class="form-label" for="pStatus">Status</label>
                    <select id="pStatus" class="form-control">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>`
        });

        await window.loadData();
    </script>
</body>
</html>
