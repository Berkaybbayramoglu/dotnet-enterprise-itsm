<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Login</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        body { 
            background: linear-gradient(135deg, var(--primary) 0%, #002255 100%);
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .login-box { 
            background: var(--bg-surface); padding: var(--spacing-xl); 
            border-radius: var(--radius-lg); box-shadow: var(--shadow-md); 
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-logo {
            display: inline-flex; align-items: center; justify-content: center;
            width: 48px; height: 48px; background-color: var(--primary-light);
            color: var(--primary); border-radius: var(--radius-md); margin-bottom: var(--spacing-md);
        }
        .login-logo svg { width: 24px; height: 24px; fill: currentColor; }
        h1 { margin-bottom: var(--spacing-lg); color: var(--text-main); font-size: 24px; }
        .form-group { text-align: left; }
        .error { color: var(--danger); text-align: center; margin-top: var(--spacing-md); display: none; font-size: 13px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.83L18.17 19H5.83L12 5.83z"/></svg>
        </div>
        <h1>Welcome Back</h1>
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <input type="text" id="username" class="form-control" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: var(--spacing-md); padding: 10px;">Sign In</button>
            <div id="errorMessage" class="error"></div>
            
            <div id="demoHint" style="margin-top: 24px; padding: 12px; background: var(--bg-hover); border: 1px solid var(--border); border-radius: 8px; text-align: left; font-size: 13px; color: var(--text-muted); line-height: 1.5;">
                <strong style="color: var(--text-main); display: block; margin-bottom: 8px;">Demo Accounts (Pwd: *123!)</strong>
                <code style="background:transparent; padding:0; color:var(--primary);">admin</code> : SuperAdmin<br>
                <code style="background:transparent; padding:0; color:var(--primary);">manager</code> : Manager<br>
                <code style="background:transparent; padding:0; color:var(--primary);">agent1</code> : Agent<br>
                <code style="background:transparent; padding:0; color:var(--primary);">agent2</code> : Agent (+ticket.close)<br>
                <code style="background:transparent; padding:0; color:var(--primary);">user1</code> : EndUser
            </div>
        </form>
    </div>

    <script type="module">
        import './js/api.js';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            try {
                await window.api.login(username, password);
                window.location.href = '/dashboard.html';
            } catch (err) {
                console.error(err);
                errorDiv.textContent = 'Login failed. Please check your credentials.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
