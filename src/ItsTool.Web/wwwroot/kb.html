<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Knowledge Base</title>
    <link rel="stylesheet" href="css/design-system.css?v=1008">
    <link href="css/quill.snow.css" rel="stylesheet">
    <style>
        /* Quill dark mode overrides for the editor container */
        .ql-container { font-family: inherit; font-size: 14px; }
        .ql-editor { min-height: 200px; max-height: 400px; overflow-y: auto; background: var(--bg-surface); color: var(--text-main); }
        .ql-toolbar { background: var(--bg-hover); border-color: var(--border) !important; border-top-left-radius: var(--radius-md); border-top-right-radius: var(--radius-md); }
        .ql-container.ql-snow { border-color: var(--border) !important; border-bottom-left-radius: var(--radius-md); border-bottom-right-radius: var(--radius-md); }
        .ql-snow .ql-stroke { stroke: var(--text-main); }
        .ql-snow .ql-fill { fill: var(--text-main); }
        .ql-snow .ql-picker { color: var(--text-main); }
    </style>
    <style>
        .kb-container { display: flex; flex-direction: column; gap: var(--spacing-lg); max-width: 1000px; margin: 0 auto; }
        .search-hero { background: linear-gradient(135deg, #0747A6 0%, #00224d 100%); padding: var(--spacing-xxl) var(--spacing-xl); border-radius: var(--radius-lg); text-align: center; color: white; margin-bottom: var(--spacing-lg); }
        .search-hero h2 { margin-bottom: var(--spacing-md); color: white; font-size: 28px; }
        
        .search-bar { display: flex; gap: var(--spacing-sm); max-width: 600px; margin: 0 auto; }
        .search-bar input { flex: 1; padding: 12px 16px; border: none; border-radius: var(--radius-md); font-size: 16px; box-shadow: var(--shadow-sm); }
        .search-bar button { padding: 12px 24px; font-size: 16px; background: var(--bg-surface); color: var(--primary); font-weight: 600; }
        .search-bar button:hover { background: var(--bg-hover); }

        .articles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--spacing-lg); }
        
        .article-card { background: var(--bg-surface); padding: var(--spacing-lg); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: flex-start; text-align: left; width: 100%; height: 100%; }
        .article-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        
        .article-card-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; margin-bottom: var(--spacing-sm); }
        .article-card h3 { margin: 0; font-size: 18px; color: var(--text-main); font-weight: 600; line-height: 1.4; }
        
        .meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: var(--spacing-md); margin-top: auto; padding-top: var(--spacing-md); border-top: 1px solid var(--border); width: 100%; }
        .meta-item { display: flex; align-items: center; gap: 4px; }
        

    </style>
</head>
<body>
    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>

                    <h2 data-i18n="kb_title">Knowledge Base</h2>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell-container dropdown" style="position:relative; margin-right: 16px;">
                        <button class="btn btn-ghost dropdown-toggle" type="button" id="bellDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="position:relative;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                            <span class="badge" id="notificationBadge" style="display:none; position:absolute; top:4px; right:4px; background:var(--danger); color:white; border-radius:50%; font-size:10px; padding:2px 4px;"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bellDropdown" id="notificationList" style="width: 320px; max-height: 400px; overflow-y:auto;">
                            <li><h6 class="dropdown-header" data-i18n="topbar_notifications">Notifications</h6></li>
                            <div id="notificationItems"></div>
                            <li><hr class="dropdown-divider"></li>
                            <li><button type="button" class="dropdown-item text-center text-muted" onclick="markAllAsRead(event)" data-i18n="topbar_mark_all_read" style="width: 100%; border: none; background: none;">Mark all as read</button></li>
                        </ul>
                    </div>
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn" data-i18n="topbar_logout">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="kb-container">
                    <div class="search-hero">
                        <h2 data-i18n="kb_hero">How can we help you today?</h2>
                        <div class="search-bar">
                            <input type="text" id="searchInput" aria-label="Search knowledge base" placeholder="Search for articles, guides, and FAQs..." data-i18n="kb_search_placeholder" data-i18n-target="placeholder">
                            <button type="button" class="btn" id="btnSearchKb" data-i18n="kb_btn_search">Search</button>
                        </div>
                        <div style="margin-top: 16px;">
                            <button type="button" class="btn btn-primary" id="btnNewArticle" style="display: none;" data-i18n="kb_btn_new">+ New Article</button>
                        </div>
                    </div>

                    <div id="kbTabs" style="display: flex; margin-bottom: 16px; border-bottom: 1px solid var(--border); gap: 16px;">
                        <button id="tabPublished" class="btn btn-ghost" style="border-bottom: 2px solid var(--primary); border-radius: 0; color: var(--primary); padding-bottom: 8px;" data-i18n="kb_tab_all">All Articles</button>
                        <button id="tabPending" class="btn btn-ghost" style="display: none; border-bottom: 2px solid transparent; border-radius: 0; padding-bottom: 8px; color: var(--text-muted);" data-i18n="kb_badge_pending">Pending Review</button>
                        <button id="tabMine" class="btn btn-ghost" style="border-bottom: 2px solid transparent; border-radius: 0; padding-bottom: 8px; color: var(--text-muted);" data-i18n="kb_tab_mine">My Suggestions</button>
                    </div>
                    
                    <div class="articles" id="articleList">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Article Edit/Create Modal -->
    <div id="articleModal" class="modal-overlay">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="modalTitle" data-i18n="kb_modal_new">New Article</h2>
                <button type="button" class="close-btn" onclick="closeModal('articleModal')" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="articleForm">
                    <input type="hidden" id="articleId" value="">
                    <div id="authorFeedbackAlert" style="display: none; padding: 12px; margin-bottom: 16px; background: rgba(var(--warning-rgb, 245,158,11), 0.1); border: 1px solid var(--warning); border-radius: 8px; color: var(--text);">
                        <strong style="color: var(--warning);"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:currentColor; margin-right:4px; vertical-align:text-bottom;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> <span data-i18n="kb_alert_feedback">Manager Feedback</span>:</strong>
                        <p id="authorFeedbackText" style="margin: 4px 0 0 0; font-size: 13px;"></p>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="articleTitle" data-i18n="kb_lbl_title">Title</label>
                        <input id="articleTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="articleCategory" data-i18n="kb_lbl_cat">Category</label>
                        <select id="articleCategory" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="articleVisibility" data-i18n="kb_lbl_vis">Visibility</label>
                        <select id="articleVisibility" class="form-control" required>
                            <option value="1" data-i18n="kb_opt_pub">Public</option>
                            <option value="0" data-i18n="kb_opt_int">Internal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="articleStatus" data-i18n="kb_lbl_status">Status</label>
                        <select id="articleStatus" class="form-control" required>
                            <option value="0" data-i18n="kb_opt_draft">Draft</option>
                            <option value="1" data-i18n="kb_opt_published">Published</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="quillEditor" data-i18n="kb_lbl_content">Content</label>
                        <div id="quillEditor"></div>
                        <input type="hidden" id="articleContent" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal('articleModal')" data-i18n="users_btn_cancel">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSaveArticle" data-i18n="kb_btn_save">Save Article</button>
            </div>
        </div>
    </div>

    <!-- Article Review Modal (For Managers) -->
    <div id="reviewModal" class="modal-overlay">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h2 data-i18n="kb_modal_review">Review Article</h2>
                <button type="button" class="close-btn" onclick="closeModal('reviewModal')" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="reviewForm">
                    <input type="hidden" id="reviewArticleId" value="">
                    <div class="form-group">
                        <label class="form-label" for="reviewStatus" data-i18n="kb_lbl_status">Status</label>
                        <select id="reviewStatus" class="form-control" required>
                            <option value="1" data-i18n="kb_opt_approve">Approve & Publish</option>
                            <option value="3" data-i18n="kb_opt_revise">Request Revision</option>
                            <option value="4" data-i18n="kb_opt_reject">Reject</option>
                        </select>
                    </div>
                    <div class="form-group" id="feedbackGroup" style="display: none;">
                        <label class="form-label" for="reviewFeedback" data-i18n="kb_lbl_feedback">Feedback / Revision Request</label>
                        <textarea id="reviewFeedback" class="form-control" rows="4"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal('reviewModal')" data-i18n="users_btn_cancel">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSubmitReview" data-i18n="kb_btn_submit_review">Submit Review</button>
            </div>
        </div>
    </div>

    <script src="js/quill.min.js"></script>
    <script type="module">
        import './js/api.js?v=999';
        import { injectShell } from './js/layout.js?v=999';
        import { bindShellActions, showToast, openModal, closeModal } from './js/ui.js?v=999';
        import { t, getCurrentLanguage } from './js/i18n.js';
        injectShell();
        
        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();
        
        window.closeModal = closeModal;
        
        function parseJwt(token) {
            try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { console.error(e);  return null;  }
        }
        const claims = parseJwt(window.api.token) || {};
        const roles = claims['http://schemas.microsoft.com/ws/2008/06/identity/claims/role'] || [];
        const perms = claims['permission'] || claims['Permissions'] || [];
        const currentUserId = Number.parseInt(claims['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier'] || claims['nameid'] || claims['sub'] || '0', 10);
        const hasManageKb = (Array.isArray(roles) ? roles.includes('SuperAdmin') : roles === 'SuperAdmin') || 
                            (Array.isArray(perms) ? perms.includes('kb.manage') : perms === 'kb.manage');
        
        document.getElementById('btnNewArticle').style.display = 'inline-flex';
        if (!hasManageKb) {
            document.getElementById('btnNewArticle').dataset.i18n = 'kb_btn_suggest';
            document.getElementById('btnNewArticle').textContent = t('kb_btn_suggest') || '+ Suggest Article';
        }
        
        let currentTab = 'published';
        let allCategories = [];
        
        if (hasManageKb) {
            document.getElementById('tabPending').style.display = 'inline-block';
        }

        const tabs = ['tabPublished', 'tabPending', 'tabMine'];
        tabs.forEach(tabId => {
            document.getElementById(tabId)?.addEventListener('click', (e) => {
                currentTab = tabId.replaceAll('tab', '').toLowerCase();
                tabs.forEach(tId => {
                    const el = document.getElementById(tId);
                    if (el) {
                        el.style.borderColor = (tId === tabId) ? 'var(--primary)' : 'transparent';
                        el.style.color = (tId === tabId) ? 'var(--primary)' : 'var(--text-muted)';
                    }
                });
                loadKb(document.getElementById('searchInput').value);
            });
        });

        function buildArticleBadges(a) {
            let badges = '';
            if (a.visibility == 0 || a.visibility === 'Internal') badges += `<span class="badge badge-warning">${t('kb_badge_internal')}</span> `;
            if (a.status == 0 || a.status === 'Draft') badges += `<span class="badge badge-default">${t('kb_badge_draft')}</span> `;
            if (a.status == 1 || a.status === 'Published') badges += `<span class="badge badge-success">${t('kb_badge_published') || 'Yayında'}</span> `;
            if (a.status == 2 || a.status === 'PendingReview') badges += `<span class="badge badge-info">${t('kb_badge_pending') || 'Pending Review'}</span> `;
            if (a.status == 3 || a.status === 'NeedsRevision') badges += `<span class="badge badge-warning" style="background: rgba(var(--warning-rgb, 245,158,11), 0.2); color: var(--warning);">${t('kb_badge_needs_rev') || 'Needs Revision'}</span> `;
            if (a.status == 4 || a.status === 'Rejected') badges += `<span class="badge badge-danger">${t('kb_badge_rejected') || 'Rejected'}</span> `;
            return badges;
        }

        function buildArticleActions(a, currentUserId, hasManageKb) {
            let actionsHtml = '';
            const isAuthor = a.authorUserId === currentUserId;
            const isPublished = a.status == 1 || a.status === 'Published';
            const isPending = a.status == 2 || a.status === 'PendingReview';
            const isDraft = a.status == 0 || a.status === 'Draft';
            const isNeedsRevision = a.status == 3 || a.status === 'NeedsRevision';
            
            if (hasManageKb || isAuthor) {
                actionsHtml = `<div class="article-actions" style="display:flex; align-items:center; gap: 8px; margin-top: 12px; margin-left: auto;" onclick="event.stopPropagation()">`;
                
                if (isAuthor) {
                    // DÖRT GÖZ İLKESİ: Yazar ASLA kendi makalesini onaylayamaz veya doğrudan yayınlayamaz.
                    actionsHtml += `<button type="button" class="btn btn-ghost" style="padding: 4px;" title="Edit" onclick="editArticle(event, ${a.id})">${t('kb_btn_edit') || 'Düzenle'}</button>`;
                    
                    if (isDraft || isNeedsRevision) {
                        actionsHtml += `<button type="button" class="btn btn-primary" style="padding: 4px 12px; font-size: 12px;" title="Onaya Gönder" onclick="submitForApproval(event, ${a.id})">${t('kb_btn_submit_approval') || 'Onaya Gönder'}</button>`;
                    } else if (isPending) {
                        actionsHtml += `<span class="badge" style="background: rgba(59,130,246,0.12); color: var(--primary); font-size: 11px; padding: 4px 8px; border-radius: 4px;">${t('kb_waiting_other_manager') || 'Farklı bir yönetici onayı bekleniyor'}</span>`;
                    } else if (isPublished && hasManageKb) {
                        actionsHtml += `<button type="button" class="btn btn-ghost" style="padding: 4px;" title="Yayından Kaldır" onclick="togglePublish(event, ${a.id}, '${a.status}')">${t('kb_btn_unpub') || 'Yayından Kaldır'}</button>`;
                    }
                    
                    actionsHtml += `<button type="button" class="btn btn-ghost text-danger" style="padding: 4px;" title="Delete" onclick="deleteArticle(event, ${a.id})">${t('kb_btn_del') || 'Sil'}</button>`;
                } else if (hasManageKb) {
                    // FARKLI BİR YÖNETİCİ: Başkasının önerdiği makaleyi inceleyebilir, onaylayabilir veya yayından kaldırabilir.
                    actionsHtml += `<button type="button" class="btn btn-ghost" style="padding: 4px;" title="Edit" onclick="editArticle(event, ${a.id})">${t('kb_btn_edit') || 'Düzenle'}</button>`;
                    
                    if (isPending) {
                        actionsHtml += `<button type="button" class="btn btn-primary" style="padding: 4px 12px; font-size: 13px;" title="Approve" onclick="quickApproveArticle(event, ${a.id})">${t('kb_btn_approve_pub') || 'Onayla'}</button>`;
                        actionsHtml += `<button type="button" class="btn btn-secondary" style="padding: 4px 12px; font-size: 13px;" title="Review" onclick="openReviewModal(event, ${a.id})">${t('kb_btn_review') || 'İncele'}</button>`;
                    } else {
                        actionsHtml += `<button type="button" class="btn btn-ghost" style="padding: 4px;" title="Toggle Publish" onclick="togglePublish(event, ${a.id}, '${a.status}')">${isPublished ? (t('kb_btn_unpub') || 'Yayından Kaldır') : (t('kb_btn_pub') || 'Yayınla')}</button>`;
                    }
                    
                    actionsHtml += `<button type="button" class="btn btn-ghost text-danger" style="padding: 4px;" title="Delete" onclick="deleteArticle(event, ${a.id})">${t('kb_btn_del') || 'Sil'}</button>`;
                }
                
                actionsHtml += `</div>`;
            }
            return actionsHtml;
        }

        function createArticleCard(a, currentUserId, hasManageKb) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'article-card';
            btn.dataset.id = a.id;
            btn.addEventListener('click', () => window.openArticle(a.id));
            
            const badges = buildArticleBadges(a);
            const actionsHtml = buildArticleActions(a, currentUserId, hasManageKb);
            
            const header = document.createElement('div');
            header.className = 'article-card-header';
            const h3 = document.createElement('h3');
            h3.textContent = a.title;
            const badgesDiv = document.createElement('div');
            badgesDiv.style.display = 'flex';
            badgesDiv.style.gap = '4px';
            badgesDiv.innerHTML = badges;
            header.appendChild(h3);
            header.appendChild(badgesDiv);

            const desc = document.createElement('p');
            desc.style.color = 'var(--text-muted)';
            desc.style.fontSize = '13px';
            desc.style.lineHeight = '1.5';
            desc.style.textAlign = 'left';
            desc.style.marginBottom = '16px';
            desc.style.display = '-webkit-box';
            desc.style.webkitLineClamp = '2';
            desc.style.webkitBoxOrient = 'vertical';
            desc.style.overflow = 'hidden';
            desc.textContent = `${t('kb_read_more_about')} ${a.title}...`;

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.style.flexWrap = 'wrap';

            const viewCountSpan = document.createElement('span');
            viewCountSpan.className = 'meta-item';
            viewCountSpan.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" style="fill: currentColor;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg> ${a.viewCount}`;
            meta.appendChild(viewCountSpan);

            const isEn = getCurrentLanguage() === 'en';
            const dateSpan = document.createElement('span');
            dateSpan.className = 'meta-item';
            dateSpan.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" style="fill: currentColor;"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg> ${new Date(a.createdAt).toLocaleString(isEn ? 'en-US' : 'tr-TR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}`;
            meta.appendChild(dateSpan);

            if (a.authorName) {
                const authorSpan = document.createElement('span');
                authorSpan.className = 'meta-item';
                const localizedDept = a.authorDepartment ? t('db_' + a.authorDepartment.toLowerCase().replaceAll(' ', '_'), a.authorDepartment) : '';
                const authorDeptStr = localizedDept ? ` (${escapeHtml(localizedDept)})` : '';
                authorSpan.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" style="fill: currentColor;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> ${t('kb_by') || (isEn ? 'By' : 'Yazan')}: ${escapeHtml(a.authorName)}${authorDeptStr}`;
                meta.appendChild(authorSpan);
            }

            if (actionsHtml) {
                const actionsDiv = document.createElement('div');
                actionsDiv.style.marginLeft = 'auto';
                actionsDiv.style.marginTop = '12px';
                actionsDiv.innerHTML = actionsHtml;
                meta.appendChild(actionsDiv);
            }

            btn.appendChild(header);
            btn.appendChild(desc);
            btn.appendChild(meta);

            return btn;
        }

        async function loadKb(keyword = '') {
            try {
                const articles = await window.api.getKbArticles(keyword);
                const list = document.getElementById('articleList');
                list.innerHTML = '';
                
                let filteredArticles = articles;
                
                if (currentTab === 'published') {
                    filteredArticles = articles.filter(a => a.status == 1 || a.status === 'Published');
                } else if (currentTab === 'pending') {
                    // Yöneticiler sadece başkalarının önerdiği onay bekleyen makaleleri görür. Kimse kendi makalesine bakamaz.
                    filteredArticles = articles.filter(a => (a.status == 2 || a.status === 'PendingReview') && a.authorUserId !== currentUserId);
                } else if (currentTab === 'mine') {
                    filteredArticles = articles.filter(a => a.authorUserId === currentUserId);
                }
                
                if (filteredArticles.length === 0) {
                    list.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
                            <svg viewBox="0 0 24 24" width="48" height="48" style="fill: var(--border); margin-bottom: 16px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            <h3>${t('kb_no_articles')}</h3>
                            <p>${t('kb_adjust_search')}</p>
                        </div>
                    `;
                    return;
                }

                filteredArticles.forEach(a => {
                    list.appendChild(createArticleCard(a, currentUserId, hasManageKb));
                });
            } catch (e) { console.error(e); 
                let errEl = document.querySelector('tbody') || document.querySelector('#overviewCards') || document.querySelector('#board') || document.querySelector('#articleList') || document.querySelector('.content-area');
                if (errEl) {
                    if (errEl.tagName === 'TBODY') {
                        errEl.innerHTML = '<tr><td colspan="100" style="text-align: center; padding: var(--spacing-xl); color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</td></tr>';
                     } else {
                        errEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</div>';
                    }
                }
 console.error(e); showToast('Search failed', 'error'); }
        }

        window.openArticle = function(id) {
            window.location.href = `/kb-article.html?id=${id}`;
        };

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replaceAll('&', "&amp;")
                .replaceAll('<', "&lt;")
                .replaceAll('>', "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        document.getElementById('btnSearchKb').addEventListener('click', async () => {
            const kw = document.getElementById('searchInput').value;
        loadKb(kw); // removed await for resilience
        });
        
        // Allow pressing enter to search
        document.getElementById('searchInput').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
        loadKb(e.target.value); // removed await for resilience
            }
        });

        let quill = null;
        function initQuill() {
            if (!quill) {
                quill = new Quill('#quillEditor', {
                    theme: 'snow',
                    modules: {
                        toolbar: [
                            [{ 'header': [1, 2, 3, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'color': [] }, { 'background': [] }],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['link', 'image'],
                            ['clean']
                        ]
                    }
                });
                quill.on('text-change', function() {
                    document.getElementById('articleContent').value = quill.root.innerHTML === '<p><br></p>' ? '' : quill.root.innerHTML;
                });
            }
        }

        document.getElementById('btnNewArticle')?.addEventListener('click', async () => {
            document.getElementById('articleId').value = '';
            document.getElementById('articleTitle').value = '';
            initQuill();
            quill.root.innerHTML = '';
            document.getElementById('articleContent').value = '';
            document.getElementById('articleVisibility').value = '1';
            
            const statusSelect = document.getElementById('articleStatus');
            statusSelect.innerHTML = `
                <option value="0">${t('kb_opt_draft') || 'Taslak'}</option>
                <option value="2">${t('kb_opt_submit_review') || 'Onaya Gönder (Yönetici İncelemesi)'}</option>
            `;
            statusSelect.value = '2';
            
            document.getElementById('authorFeedbackAlert').style.display = 'none';
            document.getElementById('btnSaveArticle').textContent = t('kb_btn_save') || 'Save Article';

            if (!hasManageKb) {
                document.getElementById('articleVisibility').parentElement.style.display = 'none';
                document.getElementById('articleStatus').parentElement.style.display = 'none';
            } else {
                document.getElementById('articleVisibility').parentElement.style.display = 'block';
                document.getElementById('articleStatus').parentElement.style.display = 'block';
            }

            document.getElementById('modalTitle').dataset.i18n = hasManageKb ? 'kb_modal_new' : 'kb_btn_suggest';
            document.getElementById('modalTitle').textContent = hasManageKb ? t('kb_modal_new') : t('kb_btn_suggest') || 'Suggest Article';
            
            if (allCategories.length === 0) {
                try {
                    allCategories = await window.api.getKbCategories();
                    const catSelect = document.getElementById('articleCategory');
                    catSelect.innerHTML = allCategories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
                } catch (e) { console.error(e);  showToast('Kategoriler yüklenemedi', 'error');  }
            }
            openModal('articleModal');
        });
        
        document.getElementById('btnSaveArticle').addEventListener('click', async () => {
            const form = document.getElementById('articleForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }
            
            const id = document.getElementById('articleId').value;
            const statusVal = Number.parseInt(document.getElementById('articleStatus').value, 10);
            const payload = {
                categoryId: Number.parseInt(document.getElementById('articleCategory').value, 10),
                title: document.getElementById('articleTitle').value,
                content: document.getElementById('articleContent').value,
                visibility: Number.parseInt(document.getElementById('articleVisibility').value, 10),
                status: Number.isNaN(statusVal) ? 2 : statusVal
            };
            
            try {
                if (id) {
                    await window.api.updateKbArticle(id, payload);
                    showToast(payload.status === 2 ? (t('kb_toast_submitted_approval') || 'Makale onay için yöneticilere iletildi.') : t('kb_toast_updated'));
                } else {
                    await window.api.createKbArticle(payload);
                    showToast(payload.status === 2 ? (t('kb_toast_submitted_approval') || 'Makale oluşturuldu ve onay için yöneticilere iletildi.') : t('kb_toast_created'));
                }
                closeModal('articleModal');
                loadKb();
            } catch (e) { console.error(e);  showToast(e.message || t('kb_toast_save_err'), 'error');  }
        });
        
        window.editArticle = async function(event, id) {
            if (event) event.stopPropagation();
            try {
                const article = await window.api.request(`/kb/articles/${id}`);
                document.getElementById('articleId').value = article.id;
                document.getElementById('articleTitle').value = article.title;
                initQuill();
                quill.root.innerHTML = article.content || '';
                document.getElementById('articleContent').value = article.content || '';
                document.getElementById('articleVisibility').value = article.visibility;
                
                const statusSelect = document.getElementById('articleStatus');
                if (article.status == 1 || article.status === 'Published') {
                    statusSelect.innerHTML = `
                        <option value="1">${t('kb_opt_published') || 'Yayında'}</option>
                        <option value="0">${t('kb_btn_unpub') || 'Taslak (Yayından Kaldır)'}</option>
                    `;
                    statusSelect.value = '1';
                } else {
                    statusSelect.innerHTML = `
                        <option value="0">${t('kb_opt_draft') || 'Taslak'}</option>
                        <option value="2">${t('kb_opt_submit_review') || 'Onaya Gönder (Yönetici İncelemesi)'}</option>
                    `;
                    statusSelect.value = (article.status == 2 || article.status === 'PendingReview' || article.status == 3 || article.status === 'NeedsRevision') ? '2' : '0';
                }

                document.getElementById('modalTitle').textContent = t('kb_modal_edit');
                
                if (allCategories.length === 0) {
                    allCategories = await window.api.getKbCategories();
                    const catSelect = document.getElementById('articleCategory');
                    catSelect.innerHTML = allCategories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
                }
                document.getElementById('articleCategory').value = article.categoryId;
                
                if (article.status === 3 && article.managerFeedback) {
                    document.getElementById('authorFeedbackAlert').style.display = 'block';
                    document.getElementById('authorFeedbackText').textContent = article.managerFeedback;
                    document.getElementById('btnSaveArticle').textContent = t('kb_btn_fix') || 'Fix & Resubmit';
                } else {
                    document.getElementById('authorFeedbackAlert').style.display = 'none';
                    document.getElementById('btnSaveArticle').textContent = t('kb_btn_save') || 'Save Article';
                }
                
                openModal('articleModal');
            } catch (e) { console.error(e);  showToast(t('kb_toast_load_err'), 'error');  }
        };

        window.quickApproveArticle = async function(event, id) {
            event.stopPropagation();
            try {
                await window.api.reviewKbArticle(id, { status: 1, feedback: '' });
                showToast(t('kb_toast_updated') || 'Article approved and published.');
                loadKb();
            } catch (e) {
                console.error(e);
                showToast(e.message || t('kb_toast_save_err') || 'Error approving article.', 'error');
            }
        };

        window.openReviewModal = function(event, id) {
            if (event) event.stopPropagation();
            document.getElementById('reviewArticleId').value = id;
            document.getElementById('reviewStatus').value = '1';
            document.getElementById('reviewFeedback').value = '';
            document.getElementById('feedbackGroup').style.display = 'none';
            openModal('reviewModal');
        };

        document.getElementById('reviewStatus').addEventListener('change', (e) => {
            if (e.target.value === '3' || e.target.value === '4') {
                document.getElementById('feedbackGroup').style.display = 'block';
            } else {
                document.getElementById('feedbackGroup').style.display = 'none';
            }
        });

        document.getElementById('btnSubmitReview').addEventListener('click', async () => {
            const form = document.getElementById('reviewForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const id = document.getElementById('reviewArticleId').value;
            const payload = {
                status: Number.parseInt(document.getElementById('reviewStatus').value, 10),
                feedback: document.getElementById('reviewFeedback').value
            };

            try {
                await window.api.reviewKbArticle(id, payload);
                showToast(t('kb_toast_updated'));
                closeModal('reviewModal');
                loadKb();
            } catch (e) {
                console.error(e);
                showToast(e.message || t('kb_toast_save_err'), 'error');
            }
        });
        
        window.togglePublish = async function(event, id, currentStatus) {
            if (event) event.stopPropagation();
            try {
                const article = await window.api.request(`/kb/articles/${id}`);
                const isCurrentlyPublished = (currentStatus == 1 || currentStatus === 'Published' || article.status == 1 || article.status === 'Published');
                
                // Dört Göz İlkesi: Yazar kendi makalesini doğrudan yayınlayamaz
                if (!isCurrentlyPublished && article.authorUserId === currentUserId) {
                    showToast(t('kb_self_publish_err') || 'Kendi önerdiğiniz makaleyi onaylayamaz veya yayınlayamazsınız. Farklı bir yönetici incelemelidir.', 'error');
                    return;
                }

                const newStatus = isCurrentlyPublished ? 0 : 1;
                const payload = {
                    categoryId: article.categoryId,
                    title: article.title,
                    content: article.content,
                    visibility: article.visibility,
                    status: newStatus
                };
                await window.api.updateKbArticle(id, payload);
                showToast(newStatus === 1 ? (t('kb_toast_pub') || 'Makale yayınlandı.') : (t('kb_toast_unpub') || 'Makale yayından kaldırıldı.'));
                loadKb();
            } catch (e) { console.error(e);  showToast(e.message || t('kb_toast_pub_err'), 'error');  }
        };

        window.submitForApproval = async function(event, id) {
            if (event) event.stopPropagation();
            try {
                const article = await window.api.request(`/kb/articles/${id}`);
                const payload = {
                    categoryId: article.categoryId,
                    title: article.title,
                    content: article.content,
                    visibility: article.visibility,
                    status: 2 // PendingReview
                };
                await window.api.updateKbArticle(id, payload);
                showToast(t('kb_toast_submitted_approval') || 'Makale inceleme ve onay için yöneticilere iletildi.');
                loadKb();
            } catch (e) {
                console.error(e);
                showToast(e.message || t('kb_toast_save_err') || 'Onaya gönderilirken hata oluştu.', 'error');
            }
        };
        
        window.deleteArticle = async function(event, id) {
            if (event) {
                event.stopPropagation();
            }
            let confirmed = false;
            if (window.ui && window.ui.showConfirmModal) {
                confirmed = await window.ui.showConfirmModal(t('kb_confirm_del_title') || 'Delete Article', t('kb_confirm_del') || 'Are you sure you want to delete this article?');
            } else {
                confirmed = confirm(t('kb_confirm_del') || 'Are you sure you want to delete this article?');
            }
            if (!confirmed) return;
            
            const articleElement = document.querySelector(`.article-card[data-id="${id}"]`);
            
            if (window.ui && window.ui.showUndoToast) {
                if (articleElement) {
                    articleElement.style.opacity = '0.5';
                    articleElement.style.pointerEvents = 'none';
                }
                
                window.ui.showUndoToast(
                    t('kb_toast_del') || 'Article deleted.',
                    async () => {
                        // Undo action
                        if (articleElement) {
                            articleElement.style.opacity = '1';
                            articleElement.style.pointerEvents = 'auto';
                        }
                    },
                    async () => {
                        // Confirm action
                        try {
                            await window.api.deleteKbArticle(id);
                            loadKb();
                        } catch (e) {
                            console.error(e);
                            showToast(t('kb_toast_del_err') || 'Error deleting article', 'error');
                            if (articleElement) {
                                articleElement.style.opacity = '1';
                                articleElement.style.pointerEvents = 'auto';
                            }
                        }
                    }
                );
            } else {
                try {
                    await window.api.deleteKbArticle(id);
                    showToast(t('kb_toast_del') || 'Article deleted.');
                    loadKb();
                } catch (e) { console.error(e); }
            }
        };
        
        await loadKb();
    </script>
</body>
</html>
