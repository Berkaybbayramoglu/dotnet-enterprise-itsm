<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Knowledge Base</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        .kb-container { display: flex; flex-direction: column; gap: var(--spacing-lg); max-width: 1000px; margin: 0 auto; }
        .search-hero { background: linear-gradient(135deg, #0747A6 0%, #00224d 100%); padding: var(--spacing-xxl) var(--spacing-xl); border-radius: var(--radius-lg); text-align: center; color: white; margin-bottom: var(--spacing-lg); }
        .search-hero h2 { margin-bottom: var(--spacing-md); color: white; font-size: 28px; }
        
        .search-bar { display: flex; gap: var(--spacing-sm); max-width: 600px; margin: 0 auto; }
        .search-bar input { flex: 1; padding: 12px 16px; border: none; border-radius: var(--radius-md); font-size: 16px; box-shadow: var(--shadow-sm); }
        .search-bar button { padding: 12px 24px; font-size: 16px; background: var(--bg-surface); color: var(--primary); font-weight: 600; }
        .search-bar button:hover { background: var(--bg-hover); }

        .articles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--spacing-lg); }
        
        .article-card { background: var(--bg-surface); padding: var(--spacing-lg); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: flex-start; text-align: left; width: 100%; height: 100%; }
        .article-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        
        .article-card-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; margin-bottom: var(--spacing-sm); }
        .article-card h3 { margin: 0; font-size: 18px; color: var(--text-main); font-weight: 600; line-height: 1.4; }
        
        .meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: var(--spacing-md); margin-top: auto; padding-top: var(--spacing-md); border-top: 1px solid var(--border); width: 100%; }
        .meta-item { display: flex; align-items: center; gap: 4px; }
        

    </style>
</head>
<body>

            </div>

                </a>
                <a href="/categories.html" class="sidebar-nav-item">

                </a>

                </a>

                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Audit Log

                <a href="/webhooks.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3z"/></svg> Webhooks
                </a>
                <a href="/rules.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49-.12-.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg> Rules

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>

                    <h2>Knowledge Base</h2>
                </div>
                <div class="topbar-right">
                    <button type="button" class="btn btn-primary" id="btnNewArticle" style="display: none;">+ New Article</button>
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="kb-container">
                    <div class="search-hero">
                        <h2>How can we help you today?</h2>
                        <div class="search-bar">
                            <input type="text" id="searchInput" aria-label="Search knowledge base" placeholder="Search for articles, guides, and FAQs...">
                            <button type="button" class="btn" id="btnSearchKb">Search</button>

                    </div>
                    
                    <div class="articles" id="articleList">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

    <!-- Article Edit/Create Modal -->
    <div id="articleModal" class="modal-overlay">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="modalTitle">New Article</h2>
                <button type="button" class="close-btn" onclick="closeModal('articleModal')" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="articleForm">
                    <input type="hidden" id="articleId" value="">
                    <div class="form-group">
                        <label class="form-label" for="articleTitle">Title</label>
                        <input id="articleTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="articleCategory">Category</label>
                        <select id="articleCategory" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="articleVisibility">Visibility</label>
                        <select id="articleVisibility" class="form-control" required>
                            <option value="0">Public</option>
                            <option value="1">Internal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="articleStatus">Status</label>
                        <select id="articleStatus" class="form-control" required>
                            <option value="0">Draft</option>
                            <option value="1">Published</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="articleContent">Content</label>
                        <textarea id="articleContent" class="form-control" rows="8" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal('articleModal')">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSaveArticle">Save Article</button>
            </div>
        </div>
    </div>

    <script type="module">
        import './js/api.js?v=2';
        import { bindShellActions, showToast, openModal, closeModal } from './js/ui.js?v=2';
        
        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();
        
        window.closeModal = closeModal;
        
        function parseJwt(token) {
            try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; }
        }
        const claims = parseJwt(window.api.token) || {};
        const roles = claims['http://schemas.microsoft.com/ws/2008/06/identity/claims/role'] || [];
        const perms = claims['Permissions'] || [];
        const hasManageKb = (Array.isArray(roles) ? roles.includes('SuperAdmin') : roles === 'SuperAdmin') || 
                            (Array.isArray(perms) ? perms.includes('kb.manage') : perms === 'kb.manage');
        
        if (hasManageKb) document.getElementById('btnNewArticle').style.display = 'inline-flex';
        
        let allCategories = [];

        async function loadKb(keyword = '') {
            try {
                const articles = await window.api.getKbArticles(keyword);
                const list = document.getElementById('articleList');
                list.innerHTML = '';
                
                if (articles.length === 0) {
                    list.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
                            <svg viewBox="0 0 24 24" width="48" height="48" style="fill: var(--border); margin-bottom: 16px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            <h3>No articles found</h3>
                            <p>Try adjusting your search terms.</p>
                        </div>
                    `;
                    return;
                }

                articles.forEach(a => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'article-card';
                    btn.addEventListener('click', () => window.openArticle(a.id));
                    
                    let badges = '';
                    if (a.visibility === 1) badges += '<span class="badge badge-warning">Internal</span> ';
                    if (a.status === 0) badges += '<span class="badge badge-default">Draft</span> ';

                    let actionsHtml = '';
                    if (hasManageKb) {
                        actionsHtml = `
                            <div class="article-actions" style="display:flex; gap: 8px; margin-top: 12px; margin-left: auto;" onclick="event.stopPropagation()">
                                <button type="button" class="btn btn-ghost" style="padding: 4px;" title="Edit" onclick="editArticle(${a.id})">Edit</button>
                                <button type="button" class="btn btn-ghost" style="padding: 4px;" title="Toggle Publish" onclick="togglePublish(${a.id}, ${a.status})">${a.status === 1 ? 'Unpublish' : 'Publish'}</button>
                                <button type="button" class="btn btn-ghost text-danger" style="padding: 4px;" title="Delete" onclick="deleteArticle(${a.id})">Delete</button>
                            </div>
                        `;
                    }
                    
                    btn.innerHTML = `
                        <div class="article-card-header">
                            <h3>${escapeHtml(a.title)}</h3>
                            <div style="display:flex; gap: 4px;">${badges}</div>
                        </div>
                        <p style="color: var(--text-muted); font-size: 13px; line-height: 1.5; text-align: left; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                            Read more about ${escapeHtml(a.title)}...
                        </p>
                        <div class="meta" style="flex-wrap: wrap;">
                            <span class="meta-item"><svg viewBox="0 0 24 24" width="14" height="14" style="fill: currentColor;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg> ${a.viewCount}</span>
                            <span class="meta-item"><svg viewBox="0 0 24 24" width="14" height="14" style="fill: currentColor;"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg> ${new Date(a.createdAt).toLocaleDateString()}</span>
                            ${actionsHtml}
                        </div>
                    `;
                    list.appendChild(btn);
                });
            } catch(e) {
                let errEl = document.querySelector('tbody') || document.querySelector('#overviewCards') || document.querySelector('#board') || document.querySelector('#articleList') || document.querySelector('.content-area');
                if (errEl) {
                    if (errEl.tagName === 'TBODY') {
                        errEl.innerHTML = '<tr><td colspan="100" style="text-align: center; padding: var(--spacing-xl); color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</td></tr>';
                    } else {
                        errEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger);">Veri yüklenemedi — API\'yi kontrol et</div>';
                    }
                }
 console.error(e); showToast('Search failed', 'error'); }
        }

        window.openArticle = function(id) {
            window.location.href = `/kb-article.html?id=${id}`;
        };

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replaceAll('&', "&amp;")
                .replaceAll('<', "&lt;")
                .replaceAll('>', "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        document.getElementById('btnSearchKb').addEventListener('click', async () => {
            const kw = document.getElementById('searchInput').value;
        loadKb(kw); // removed await for resilience
        });
        
        // Allow pressing enter to search
        document.getElementById('searchInput').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
        loadKb(e.target.value); // removed await for resilience
            }
        });

        document.getElementById('btnNewArticle')?.addEventListener('click', async () => {
            document.getElementById('articleId').value = '';
            document.getElementById('articleTitle').value = '';
            document.getElementById('articleContent').value = '';
            document.getElementById('articleVisibility').value = '0';
            document.getElementById('articleStatus').value = '0';
            document.getElementById('modalTitle').textContent = 'New Article';
            
            if (allCategories.length === 0) {
                try {
                    allCategories = await window.api.getKbCategories();
                    const catSelect = document.getElementById('articleCategory');
                    catSelect.innerHTML = allCategories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
                } catch(e) { showToast('Kategoriler yüklenemedi', 'error'); }
            }
            openModal('articleModal');
        });
        
        document.getElementById('btnSaveArticle').addEventListener('click', async () => {
            const form = document.getElementById('articleForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }
            
            const id = document.getElementById('articleId').value;
            const payload = {
                categoryId: Number.parseInt(document.getElementById('articleCategory').value),
                title: document.getElementById('articleTitle').value,
                content: document.getElementById('articleContent').value,
                visibility: Number.parseInt(document.getElementById('articleVisibility').value),
                status: Number.parseInt(document.getElementById('articleStatus').value)
            };
            
            try {
                if (id) {
                    await window.api.updateKbArticle(id, payload);
                    showToast('Article updated successfully');
                } else {
                    await window.api.createKbArticle(payload);
                    showToast('Article created successfully');
                }
                closeModal('articleModal');
                loadKb();
            } catch(e) { showToast('Error saving article', 'error'); }
        });
        
        window.editArticle = async function(id) {
            try {
                const article = await window.api.request(`/kb/articles/${id}`);
                document.getElementById('articleId').value = article.id;
                document.getElementById('articleTitle').value = article.title;
                document.getElementById('articleContent').value = article.content;
                document.getElementById('articleVisibility').value = article.visibility;
                document.getElementById('articleStatus').value = article.status;
                document.getElementById('modalTitle').textContent = 'Edit Article';
                
                if (allCategories.length === 0) {
                    allCategories = await window.api.getKbCategories();
                    const catSelect = document.getElementById('articleCategory');
                    catSelect.innerHTML = allCategories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
                }
                document.getElementById('articleCategory').value = article.categoryId;
                openModal('articleModal');
            } catch(e) { showToast('Error fetching article details', 'error'); }
        };
        
        window.togglePublish = async function(id, currentStatus) {
            try {
                const article = await window.api.request(`/kb/articles/${id}`);
                const payload = {
                    categoryId: article.categoryId,
                    title: article.title,
                    content: article.content,
                    visibility: article.visibility,
                    status: currentStatus === 1 ? 0 : 1
                };
                await window.api.updateKbArticle(id, payload);
                showToast(payload.status === 1 ? 'Article published' : 'Article unpublished');
                loadKb();
            } catch(e) { showToast('Error toggling publish state', 'error'); }
        };
        
        window.deleteArticle = async function(id) {
            if (!confirm('Are you sure you want to delete this article?')) return;
            try {
                await window.api.deleteKbArticle(id);
                showToast('Article deleted successfully');
                loadKb();
            } catch (e) { console.error(e); }
        };
        
        loadKb();
    </script>
</body>
</html>
