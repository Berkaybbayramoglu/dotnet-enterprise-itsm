<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM Tool - Create Ticket</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        .form-section { background: var(--bg-surface); padding: var(--spacing-lg); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); margin-bottom: var(--spacing-lg); border: 1px solid var(--border); }
        .form-section h3 { font-size: 16px; margin-bottom: var(--spacing-md); color: var(--primary); padding-bottom: var(--spacing-sm); border-bottom: 1px solid var(--border); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md); }
    </style>
</head>
<body>
    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>

                    <div style="display:flex; align-items:center; gap: 8px;">
                        <a href="/tickets.html" class="btn btn-ghost" style="padding: 4px;"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></a>
                        <h2>Create New Ticket</h2>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div style="max-width: 800px; margin: 0 auto;">
                    <form id="createForm">
                        <div class="form-section">
                            <h3>Basic Details</h3>
                            <div class="form-group">
                                <label class="form-label" for="title">Title *</label>
                                <input class="form-control" type="text" id="title" required placeholder="Brief summary of the issue">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="desc">Description *</label>
                                <textarea class="form-control" id="desc" rows="5" required placeholder="Detailed description..."></textarea>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>Categorization</h3>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label class="form-label" for="projectId">Project *</label>
                                    <select class="form-control" id="projectId" required><option value="">Select Project</option></select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="categoryId">Category *</label>
                                    <select class="form-control" id="categoryId" required><option value="">Select Category</option></select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="typeId">Ticket Type *</label>
                                    <select class="form-control" id="typeId" required><option value="">Select Type</option></select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="priorityId">Priority *</label>
                                    <select class="form-control" id="priorityId" required><option value="">Select Priority</option></select>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>Additional Information</h3>
                            <div id="dynamicFields">
                                <div class="empty-state" style="padding: var(--spacing-md);">
                                    <p style="margin: 0; font-size: 13px;">Select Project, Category, and Type to load custom fields.</p>
                                </div>
                            </div>
                        </div>

                        <div style="display: flex; justify-content: flex-end; gap: var(--spacing-sm);">
                            <a href="/tickets.html" class="btn btn-ghost">Cancel</a>
                            <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Create Ticket</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { injectShell } from './js/layout.js';
        import './js/api.js';
        import { bindShellActions, showToast } from './js/ui.js';
        injectShell();
        
        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();
        
        let currentPlacements = [];

        async function loadLookups() {
            try {
                const lookup = await window.api.request('/lookup');

                const populate = (id, data) => {
                    const sel = document.getElementById(id);
                    data.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        opt.textContent = d.name;
                        sel.appendChild(opt);
                    });
                };

                populate('projectId', lookup.projects);
                populate('categoryId', lookup.categories);
                populate('typeId', lookup.ticketTypes);
                populate('priorityId', lookup.priorities);
            } catch (err) {
                console.error(err);
                showToast('Failed to load lookup data', 'error');
            }
        }

        async function renderSelectField(def, place) {
            const input = document.createElement('select');
            input.className = 'form-control';
            if (def.fieldType === 4) input.multiple = true;
            
            const opts = await window.api.getFieldOptions(def.id);
            opts.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.value;
                opt.textContent = o.label;
                input.appendChild(opt);
            });
            return input;
        }

        function renderInputField(def) {
            const input = document.createElement('input');
            input.className = 'form-control';
            if (def.fieldType === 0) input.type = 'text';
            else if (def.fieldType === 1) input.type = 'number';
            else if (def.fieldType === 2) input.type = 'date';
            return input;
        }

        async function renderDynamicField(place, container) {
            const def = await window.api.request(`/DynamicForm/definitions/${place.fieldDefinitionId}`);
            const fg = document.createElement('div');
            fg.className = 'form-group';
            
            const lbl = document.createElement('label');
            lbl.className = 'form-label';
            lbl.textContent = def.label + (place.isRequired ? ' *' : '');
            lbl.setAttribute('for', 'cf_' + def.key);
            fg.appendChild(lbl);

            let input;
            if (def.fieldType === 3 || def.fieldType === 4) {
                input = await renderSelectField(def, place);
            } else {
                input = renderInputField(def);
            }

            input.id = 'cf_' + def.key;
            if (place.isRequired) input.required = true;
            
            fg.appendChild(input);
            container.appendChild(fg);
        }

        window.loadDynamicFields = async function() {
            const pId = document.getElementById('projectId').value;
            const cId = document.getElementById('categoryId').value;
            const tId = document.getElementById('typeId').value;
            
            if (!pId || !cId || !tId) return;

            const container = document.getElementById('dynamicFields');
            container.innerHTML = '<p class="text-muted" style="text-align: center; font-size: 13px;">Loading fields...</p>';

            try {
                currentPlacements = await window.api.getPlacements(pId, cId, tId);
                container.innerHTML = '';
                
                if (currentPlacements.length === 0) {
                    container.innerHTML = '<div class="empty-state" style="padding: var(--spacing-sm);"><p style="margin: 0; font-size: 13px;">No custom fields configured for this selection.</p></div>';
                    return;
                }

                currentPlacements.sort((a,b) => a.sortOrder - b.sortOrder);
                
                for (const place of currentPlacements) {
                    await renderDynamicField(place, container);
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<span class="text-danger">Failed to load fields.</span>';
            }
        };

        ['projectId', 'categoryId', 'typeId'].forEach(id => {
            document.getElementById(id).addEventListener('change', window.loadDynamicFields);
        });

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const customFields = {};
            
            const inputs = document.querySelectorAll('#dynamicFields [id^="cf_"]');
            inputs.forEach(inp => {
                const key = inp.id.substring(3);
                if (inp.multiple) {
                    const vals = Array.from(inp.selectedOptions).map(o => o.value);
                    customFields[key] = vals.join(',');
                } else {
                    customFields[key] = inp.value;
                }
            });

            const payload = {
                title: document.getElementById('title').value,
                description: document.getElementById('desc').value,
                projectId: Number.parseInt(document.getElementById('projectId').value),
                categoryId: Number.parseInt(document.getElementById('categoryId').value),
                typeId: Number.parseInt(document.getElementById('typeId').value),
                priorityId: Number.parseInt(document.getElementById('priorityId').value),
                requesterUserId: 1, // simplified for demo
                customFields: customFields
            };

            try {
                const res = await window.api.request('/ticket', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                showToast('Ticket created successfully!');
                setTimeout(() => window.location.href = `/ticket-detail.html?id=${res.id}`, 1000);
            } catch (err) {
                console.error(err);
                showToast('Failed to create ticket', 'error');
            }
        });
        await loadLookups();
    </script>
</body>
</html>
